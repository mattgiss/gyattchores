const rowToLocal = r => ({ id:'r_'+r.id, remoteId:r.id, synced:true, statusDirty:false, playerId:r.player_id, playerName:r.player_name, choreId:r.chore_id, choreName:r.chore_name, choreIcon:'', points:r.points, timestamp:r.created_at, status:r.status });

// ─── CARD ENGINE ─────────────────────────────────────────────────────────────
const cardKey = id => `gyattchores_card_${id}_${new Date().toDateString()}`;

const neglectDays = (choreId, playerId, logs) => {
  const last = logs
    .filter(l => l.playerId===playerId && l.choreId===choreId && l.status==='approved')
    .sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp))[0];
  return last ? Math.floor((Date.now()-new Date(last.timestamp))/86400000) : 999;
};

const enrichChore = (chore, days) => {
  let tier = 0;
  for (let i = chore.tierDays.length-1; i>=0; i--) { if (days>=chore.tierDays[i]){ tier=i; break; } }
  return { ...chore, neglectDays:days, currentMinutes:chore.tiers[tier], escalLevel:tier };
};

// How many minutes of chores a player can put on their daily card.
const DAILY_MINUTES = 25;

// The chore pool, enriched with each chore's current minutes/escalation for this
// player, ranked most-neglected first so the overdue stuff surfaces as a
// suggestion — but the player picks what actually goes on the card.
const pickableChores = (playerId, logs) =>
  CHORE_POOL
    .map(c => enrichChore(c, neglectDays(c.id, playerId, logs)))
    .sort((a,b) => (b.neglectDays - a.neglectDays) || (a.currentMinutes - b.currentMinutes));

// Top a selection up to the daily budget with chores that "make sense": same
// room/category as what's already picked first, then the most-neglected, always
// the short everyday stuff. The goal is a full ~25-minute card, not a token one.
const suggestFill = (pickedIds, pool, cap) => {
  const result = [...pickedIds];
  const cats   = new Set(pool.filter(c=>pickedIds.includes(c.id)).map(c=>c.cat));
  let total    = pool.filter(c=>pickedIds.includes(c.id)).reduce((s,c)=>s+c.currentMinutes,0);
  const candidates = pool
    .filter(c => !pickedIds.includes(c.id))
    .sort((a,b) => {
      const aff = (cats.has(b.cat)?1:0) - (cats.has(a.cat)?1:0);   // same-area first
      return aff || (b.neglectDays - a.neglectDays) || (b.currentMinutes - a.currentMinutes);
    });
  for (const c of candidates) {
    if (total + c.currentMinutes <= cap) { result.push(c.id); total += c.currentMinutes; }
  }
  return result;
};

// Build a fresh card from the chores the player picked.

// Reconstruct today's already-submitted card from the synced logs. The card
// object itself only lives in the picking device's localStorage — only the
// resulting chore logs sync between devices — so without this a parent (or any
// other device) sees the picker again instead of what the kid already submitted.
const cardFromLogs = (playerId, logs) => {
  const today  = new Date().toDateString();
  // Include rejected too, so a parent's rejection stays visible on the card
  // (marked ✗) instead of the chore silently disappearing.
  const todays = logs.filter(l =>
    l.playerId === playerId &&
    (l.status === 'pending' || l.status === 'approved' || l.status === 'rejected') &&
    new Date(l.timestamp).toDateString() === today
  );
  if (!todays.length) return null;
  // De-dupe by chore — a chore is only on the card once.
  const seen = new Set();
  const chores = [];
  for (const l of todays) {
    if (seen.has(l.choreId)) continue;
    seen.add(l.choreId);
    const base = CHORE_POOL.find(c => c.id === l.choreId);
    chores.push(base
      ? enrichChore(base, neglectDays(l.choreId, playerId, logs))
      : { id:l.choreId, name:l.choreName, cat:'', pts:l.points, currentMinutes:0, escalLevel:0, neglectDays:0 });
  }
  return { date:today, chores, checked:chores.map(()=>true), submitted:true };
};

// ─── XP / RANK / STREAK ───────────────────────────────────────────────────────
// Call-of-Duty-style progression: XP comes fast, levels are short so rank-ups
// hit often, and momentum (a daily streak) multiplies the XP you earn.
const DAY_MS = 86400000;

// Streak multiplier — a day's chores are worth more XP the longer the run, up to 2x.
const momentumMult = streak => 1 + Math.min(streak, 10) * 0.1;

// XP needed to go from `lvl` to `lvl+1`. Short, gently rising → frequent level-ups.
const xpToNext = lvl => 60 + (lvl - 1) * 20;

// Lifetime XP. Approved chores are bucketed by day and each day's points are
// scaled by that day's running streak multiplier, so consecutive days bank XP
// faster. XP only ever grows; breaking a streak just resets the multiplier.
// Approved logs for a player, collapsed to one per chore per local day. The
// game only allows a chore once per day, so any extra rows are sync
// duplicates — they must not double-bank XP or minutes.
const approvedOncePerDay = (playerId, logs) => {
  const seen = new Set(), out = [];
  logs.filter(l => l.playerId===playerId && l.status==='approved').forEach(l => {
    const d = new Date(l.timestamp); d.setHours(0,0,0,0);
    const key = `${d.getTime()}|${l.choreId}`;
    if (seen.has(key)) return;
    seen.add(key); out.push({ day:d.getTime(), log:l });
  });
  return out;
};

const getXP = (playerId, logs) => {
  const byDay = {};
  approvedOncePerDay(playerId, logs).forEach(({day, log}) => {
    byDay[day] = (byDay[day] || 0) + log.points;
  });
  const days = Object.keys(byDay).map(Number).sort((a,b)=>a-b);
  let xp=0, run=0, prev=null;
  for (const day of days) {
    run = (prev!==null && day-prev===DAY_MS) ? run+1 : 1;
    xp += Math.round(byDay[day] * momentumMult(run-1));   // first day of a run = 1x
    prev = day;
  }
  return xp;
};

// Each level is framed as a version number — every level-up ships a new, better
// release of yourself (v1.0 → v1.1 → … → v2.0). Ten minor versions roll into a
// new major version.
const toVersion = lvl => `v${Math.floor((lvl-1)/10)+1}.${(lvl-1)%10}`;

// Resolve lifetime XP into a level/version and progress toward the next one.
const getRank = xp => {
  let level=1, into=xp;
  while (into >= xpToNext(level)) { into -= xpToNext(level); level++; }
  const need = xpToNext(level);
  return { level, version:toVersion(level), nextVersion:toVersion(level+1), into, need, pct: Math.round(into/need*100) };
};

const getStreak = (playerId, logs) => {
  let streak=0; const d=new Date(); d.setHours(0,0,0,0);
  for (let i=0; i<365; i++) {
    const has = logs.some(l => { const lt=new Date(l.timestamp); lt.setHours(0,0,0,0); return l.playerId===playerId && l.status==='approved' && lt.getTime()===d.getTime(); });
    if (!has) break; streak++; d.setDate(d.getDate()-1);
  }
  return streak;
};

// ─── DAILY MINUTES LOG ─────────────────────────────────────────────────────────
// How many days of the daily log the home-page grid shows.
const LOG_DAYS = 30;

// The minute value a chore contributed to a daily card. New logs record the
// exact minutes the card was budgeted at (escalation included). Older logs and
// rows pulled from another device predate that field, so fall back to the
// chore's base tier — the minutes an un-escalated card is budgeted against —
// and finally to the stored points for any chore no longer in the pool.
const choreMinutes = log => {
  if (typeof log.minutes === 'number') return log.minutes;
  const c = CHORE_POOL.find(c => c.id === log.choreId);
  return c ? c.tiers[0] : (log.points || 0);
};

// Minutes of *approved* chores a player completed on each local day, keyed by
// that day's midnight timestamp. Approved (parent-verified) is what counts
// everywhere else in the app — streaks, XP — so the log follows the same rule.
const minutesByDay = (playerId, logs) => {
  const byDay = {};
  approvedOncePerDay(playerId, logs).forEach(({day, log}) => {
    byDay[day] = (byDay[day] || 0) + choreMinutes(log);
  });
  return byDay;
};

// The last LOG_DAYS day-start timestamps, oldest → newest (today last).
const recentDays = () => {
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for (let i=LOG_DAYS-1; i>=0; i--) { const d=new Date(today); d.setDate(d.getDate()-i); days.push(d.getTime()); }
  return days;
};

// ─── CHORE ROW ───────────────────────────────────────────────────────────────
function ChoreRow({ chore, checked, onToggle, status }) {
  const escalLabel = ['', '!', '!!'][chore.escalLevel] || '';
  const escalColor = ['#555', '#F5A623', '#EF4444'][chore.escalLevel];
  // Once submitted, the right side reports the parent's verdict instead of minutes.
  const statusMeta = {
    approved: { txt:'✓ approved', col:'#16A34A' },
    rejected: { txt:'✗ rejected', col:'#EF4444' },
    pending:  { txt:'· awaiting', col:'#F5A623' },
  }[status];
  // Before submission the row is a toggle (done/not done); once a verdict is in
  // it's read-only. Expose the right semantics + keyboard support either way.
  const a11y = status
    ? { 'aria-label': `${chore.name}, ${ {approved:'approved', rejected:'rejected', pending:'awaiting approval'}[status] }` }
    : { role:'checkbox', 'aria-checked':checked, tabIndex:0, 'aria-label':chore.name,
        onKeyDown:e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onToggle(); } } };
  return (
    <div onClick={onToggle} {...a11y} style={{
      display:'flex', alignItems:'center', gap:'12px',
      padding:'14px 0', borderBottom:'1px solid #e5e5e5',
      cursor:'pointer',
    }}>

      }}>
        {checked ? '[+]' : '[ ]'}

      <span style={{
        flex:1, fontFamily:'monospace', fontSize:'0.88rem',
        color: checked ? '#bbb' : '#111',
        textDecoration: checked ? 'line-through' : 'none',
      }}>
        {chore.name}
      </span>
      {statusMeta ? (
        <span style={{
          fontFamily:'monospace', fontSize:'0.72rem', flexShrink:0,
          color: statusMeta.col, letterSpacing:'1px',
        }}>
          {statusMeta.txt}
        </span>
      ) : (
        <span style={{
          fontFamily:'monospace', fontSize:'0.75rem', flexShrink:0,
          color: escalLabel ? escalColor : '#bbb',
        }}>
          {escalLabel ? `${escalLabel} ` : ''}{chore.currentMinutes}m
        </span>
      )}
    </div>
  );
}

// ─── SYNC + BUILD INDICATOR ───────────────────────────────────────────────────
// Shows the sync state plus the build version. The build is BLUE when this is
// the latest deployed build, RED when a newer one is live (you're on a cached/
// stale copy — refresh), and grey when it can't be checked (e.g. offline).
function SyncIndicator({ syncStatus, buildStatus }) {
  const syncLabel = syncStatus==='syncing' ? 'sync...' : syncStatus==='offline' ? 'offline' : 'live';
  const syncColor = syncStatus==='offline' ? '#EF4444' : syncStatus==='syncing' ? '#F5A623' : '#bbb';
  const buildColor = buildStatus==='latest' ? '#3B82F6' : buildStatus==='stale' ? '#EF4444' : '#bbb';
  const buildTitle = buildStatus==='stale'  ? 'A newer build is live — refresh to update'
                   : buildStatus==='latest' ? 'You have the latest build'
                   : 'Build status unknown';
  return (
    <span style={{display:'flex', gap:'8px', alignItems:'baseline', fontFamily:'monospace'}}>
      <span style={{fontSize:'0.65rem', color:syncColor, letterSpacing:'2px'}}>{syncLabel}</span>
      <span style={{fontSize:'0.58rem', color:buildColor, letterSpacing:'1px'}} title={buildTitle}>build {BUILD}</span>
    </span>
  );
}

// ─── CHORE PICKER ────────────────────────────────────────────────────────────
// A full day is ~25 min of work. The player picks what they want, then we
// auto-suggest sensible short chores to fill the rest — building the habit of
// doing a little every day so nothing piles up into a long chore.
// In `bonus` mode (the bonus round, after the day's card is in) there's no
// minute cap and no fill-to-25 — pick anything not already logged today and
// every chore counts at normal points.
function ChorePicker({ player, logs, syncStatus, buildStatus, onBack, onConfirm, bonus=false, excludeIds }) {
  const pool = pickableChores(player.id, logs).filter(c => !(excludeIds && excludeIds.has(c.id)));
  const [picked, setPicked]       = useState([]);  // all selected ids
  const [suggested, setSuggested] = useState([]);  // subset of picked we auto-added
  const [locking, setLocking]     = useState(false);

  const chosen    = pool.filter(c => picked.includes(c.id));
  const total     = chosen.reduce((s,c)=>s+c.currentMinutes, 0);
  const remaining = (bonus ? Infinity : DAILY_MINUTES) - total;

  const minUnpicked = pool.filter(c=>!picked.includes(c.id)).reduce((m,c)=>Math.min(m,c.currentMinutes), Infinity);
  const canAddMore  = !bonus && minUnpicked <= remaining;   // a chore still fits the budget
  const full        = total >= DAILY_MINUTES - 5;           // 20+ min counts as a full day
  const ready       = chosen.length >= 1 && (bonus || full || !canAddMore);

  const toggle = c => {
    if (picked.includes(c.id)) {
      setPicked(picked.filter(id=>id!==c.id));
      setSuggested(suggested.filter(id=>id!==c.id));
    } else if (c.currentMinutes <= remaining) {
      setPicked([...picked, c.id]);                          // a manual pick, not a suggestion
      setSuggested(suggested.filter(id=>id!==c.id));
    }
  };

  const fill = () => {
    const next  = suggestFill(picked, pool, DAILY_MINUTES);
    const added = next.filter(id=>!picked.includes(id));
    setPicked(next);
    setSuggested([...new Set([...suggested.filter(id=>next.includes(id)), ...added])]);
  };

  return (
    <div className="fade-in" style={{display:'flex', flexDirection:'column', height:'100%'}}>
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'12px 20px', borderBottom:'1px solid #e5e5e5', flexShrink:0,
      }}>
        <button onClick={onBack} aria-label="Go back" style={{
          background:'none', border:'none', color:'#999',
          fontSize:'0.75rem', cursor:'pointer', fontFamily:'monospace', letterSpacing:'1px',
        }}>← back</button>
        <SyncIndicator syncStatus={syncStatus} buildStatus={buildStatus} />
      </div>

      <div className="scroll" style={{flex:1, padding:'28px 20px 0'}}>
        <div style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace', letterSpacing:'3px', marginBottom:'6px'}}>
          {bonus ? 'bonus round' : "build today's card"}
        </div>
        <div style={{fontSize:'0.82rem', color:'#111', fontFamily:'monospace', marginBottom:'2px'}}>
          {bonus ? 'log extra chores — no cap, all normal points' : `pick what you want — then fill to ${DAILY_MINUTES} min`}
        </div>

        <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginTop:'18px', marginBottom:'5px'}}>
          <span style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace', letterSpacing:'2px'}}>
            {chosen.length} picked
          </span>
          <span style={{fontSize:'0.72rem', color:ACCENT, fontFamily:'monospace', fontWeight:700}}>
            {bonus ? `${total}m` : `${total} / ${DAILY_MINUTES}m`}
          </span>
        </div>
        {!bonus && (
          <div style={{height:'4px', background:'#eee', borderRadius:'2px', overflow:'hidden', marginBottom:'18px'}}>
            <div style={{height:'100%', width:`${Math.min(100,(total/DAILY_MINUTES)*100)}%`, background:ACCENT, transition:'width 0.2s'}}/>
          </div>
        )}

        <div style={{marginBottom:'16px'}}>
          {pool.map(c => {
            const on         = picked.includes(c.id);
            const isSug      = suggested.includes(c.id);
            const tooBig     = !on && c.currentMinutes > remaining;
            const escalLabel = ['', '!', '!!'][c.escalLevel] || '';
            const escalColor = ['#555', '#F5A623', '#EF4444'][c.escalLevel];
            return (
              <div key={c.id} onClick={()=>{ if(!tooBig) toggle(c); }} style={{
                display:'flex', alignItems:'center', gap:'12px',
                padding:'14px 0', borderBottom:'1px solid #e5e5e5',
                cursor: tooBig ? 'default' : 'pointer', opacity: tooBig ? 0.35 : 1,
              }}>
                <span style={{
                  color: on ? ACCENT : '#bbb',
                  fontFamily:'monospace', fontSize:'0.9rem', flexShrink:0, userSelect:'none',
                }}>
                  {on ? '[+]' : '[ ]'}
                </span>
                <span style={{
                  flex:1, fontFamily:'monospace', fontSize:'0.88rem',
                  color: on ? ACCENT : '#111',
                }}>
                  {c.name}
                  {isSug && (
                    <span style={{marginLeft:'8px', fontSize:'0.6rem', color:'#bbb', letterSpacing:'1px'}}>suggested</span>
                  )}
                </span>
                <span style={{
                  fontFamily:'monospace', fontSize:'0.75rem', flexShrink:0,
                  color: escalLabel ? escalColor : '#bbb',
                }}>
                  {escalLabel ? `${escalLabel} ` : ''}{c.currentMinutes}m
                </span>
              </div>
            );
          })}
        </div>

        {pool.some(c=>c.escalLevel>0) && (
          <div style={{fontSize:'0.62rem', color:'#777', fontFamily:'monospace', letterSpacing:'1px', marginBottom:'16px'}}>
            ! = neglected &nbsp; !! = long overdue
          </div>
        )}
        <div style={{height:'24px'}}/>
      </div>

      <div style={{padding:'14px 20px', borderTop:'1px solid #e5e5e5', flexShrink:0}}>
        {canAddMore && (
          <button onClick={fill} style={{
            width:'100%', padding:'13px', marginBottom:'8px', cursor:'pointer',
            background:'transparent', border:`1px solid ${ACCENT}`, color:ACCENT,
            fontSize:'0.72rem', fontWeight:700, letterSpacing:'2px', fontFamily:'monospace',
          }}>
            {chosen.length ? `✨ FILL TO ${DAILY_MINUTES}M` : `✨ SUGGEST A ${DAILY_MINUTES}-MIN CARD`}
          </button>
        )}
        <button onClick={()=>{ if(ready && !locking){ setLocking(true); onConfirm(chosen); } }} disabled={!ready||locking} style={{
          width:'100%', padding:'17px', cursor:ready?'pointer':'default',
          background: ready ? ACCENT : 'transparent',
          border:`1px solid ${ready ? ACCENT : '#e0e0e0'}`,
          color: ready ? '#fff' : '#aaa',
          fontSize:'0.75rem', fontWeight:800, letterSpacing:'3px',
          fontFamily:'monospace', transition:'all 0.15s',
        }}>
          {locking ? '...'
            : ready
              ? bonus
                ? `LOG ${chosen.length} BONUS CHORE${chosen.length>1?'S':''} · ${total}M`
                : `LOCK IN ${chosen.length} CHORE${chosen.length>1?'S':''} · ${total}M`
              : chosen.length ? `ADD MORE TO REACH ${DAILY_MINUTES}M` : bonus ? `PICK CHORES TO LOG` : `PICK OR SUGGEST CHORES`}
        </button>
      </div>
    </div>
  );
}

// ─── PLAYER CARD VIEW ────────────────────────────────────────────────────────
function PlayerCardView({ player, logs, onBack, onSubmitCard, syncStatus, buildStatus }) {
  const streak   = getStreak(player.id, logs);
  const xp       = getXP(player.id, logs);
  const rank     = getRank(xp);
  const mult     = momentumMult(streak);
  const [card, setCard]         = useState(() => loadCard(player.id));
  const [submitting, setSubmit] = useState(false);
  const [bonusPicking, setBonusPicking] = useState(false);

  // The card the player is actively picking/checking lives in this device's
  // localStorage. If there's none here, fall back to reconstructing today's
  // already-submitted card from the synced logs, so every device shows what
  // the kid picked instead of re-offering the picker.
  const view = card || cardFromLogs(player.id, logs);

  // No card here and nothing submitted yet — let the player pick their chores.
  if (!view) {
    return (
      <ChorePicker
        player={player} logs={logs} syncStatus={syncStatus} buildStatus={buildStatus}
        onBack={onBack}
        onConfirm={chores => setCard(buildCard(player.id, chores))}
      />
    );
  }

  const totalMin   = view.chores.reduce((s,c)=>s+c.currentMinutes,0);
  const allChecked = view.checked.every(Boolean);
  const doneCount  = view.checked.filter(Boolean).length;
  const pending    = logs.filter(l=>l.playerId===player.id&&l.status==='pending').length;

  // Per-chore approval state for today, read from the synced logs so a parent's
  // approve/reject actually shows up on the card (the card object itself only
  // tracks checked/submitted, not approval). Approved/rejected win over pending
  // if more than one log exists for a chore.
  const today = new Date().toDateString();
  const statusByChore = {};
  const rankStatus = { approved:3, rejected:2, pending:1 };
  logs.forEach(l => {
    if (l.playerId!==player.id || new Date(l.timestamp).toDateString()!==today) return;
    const cur = statusByChore[l.choreId];
    if (!cur || (rankStatus[l.status]||0) > (rankStatus[cur]||0)) statusByChore[l.choreId] = l.status;
  });
  // On a submitted card a chore with no log yet is awaiting approval.
  const choreStatus = c => statusByChore[c.id] || (view.submitted ? 'pending' : null);
  const nApproved = view.chores.filter(c=>choreStatus(c)==='approved').length;
  const nRejected = view.chores.filter(c=>choreStatus(c)==='rejected').length;
  const nTotal    = view.chores.length;

  // Bonus-round chores: today's logs that aren't on the card. The bonus round
  // logs chores directly (no second check-off pass — the work is already done),
  // so the card object alone doesn't tell the whole day. On a device that
  // reconstructed the card from logs this is empty — everything shows on the
  // card there, which is fine: the split is cosmetic, approval flow is the same.
  const cardIds  = new Set(view.chores.map(c=>c.id));
  const seenB    = new Set();
  const bonusRows = [];
  logs.forEach(l => {
    if (l.playerId!==player.id || new Date(l.timestamp).toDateString()!==today) return;
    if (l.status!=='pending' && l.status!=='approved' && l.status!=='rejected') return;
    if (cardIds.has(l.choreId) || seenB.has(l.choreId)) return;
    seenB.add(l.choreId);
    const base = CHORE_POOL.find(c=>c.id===l.choreId);
    bonusRows.push(base
      ? enrichChore(base, neglectDays(l.choreId, player.id, logs))
      : { id:l.choreId, name:l.choreName, cat:'', pts:l.points, currentMinutes:0, escalLevel:0, neglectDays:0 });
  });
  const bonusMin    = bonusRows.reduce((s,c)=>s+c.currentMinutes,0);
  // A chore can be logged once per day, card or bonus — after that its
  // "cooldown" restarts on approval and it comes back tomorrow at base minutes.
  const loggedToday = new Set([...cardIds, ...bonusRows.map(c=>c.id)]);
  const bonusLeft   = CHORE_POOL.filter(c=>!loggedToday.has(c.id)).length;

  if (bonusPicking) {
    return (
      <ChorePicker
        player={player} logs={logs} syncStatus={syncStatus} buildStatus={buildStatus}
        bonus excludeIds={loggedToday}
        onBack={()=>setBonusPicking(false)}
        onConfirm={async chores => { await onSubmitCard(chores); setBonusPicking(false); }}
      />
    );
  }

  const toggle = i => {
    if (!card || view.submitted) return;
    const next = { ...card, checked: card.checked.map((v,idx)=>idx===i?!v:v) };
    setCard(next); saveCard(player.id, next);
  };

  const submit = async () => {
    if (!allChecked || submitting || !card || card.submitted) return;
    setSubmit(true);
    try {
      await onSubmitCard(card.chores);
      const next = { ...card, submitted:true };
      setCard(next); saveCard(player.id, next);
    } finally { setSubmit(false); }
  };

  return (
    <div className="fade-in" style={{display:'flex', flexDirection:'column', height:'100%'}}>
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'12px 20px', borderBottom:'1px solid #e5e5e5', flexShrink:0,
      }}>
        <button onClick={onBack} aria-label="Go back" style={{
          background:'none', border:'none', color:'#999',
          fontSize:'0.75rem', cursor:'pointer', fontFamily:'monospace', letterSpacing:'1px',
        }}>← back</button>
        <SyncIndicator syncStatus={syncStatus} buildStatus={buildStatus} />
      </div>

      <div className="scroll" style={{flex:1, padding:'28px 20px 0'}}>

        <div style={{marginBottom:'28px'}}>
          <div style={{
            fontSize:'0.65rem', color:'#888', fontFamily:'monospace',
            letterSpacing:'3px', marginBottom:'6px',
          }}>
            player
          </div>
          <div style={{
            fontSize:'1.4rem', fontWeight:900, color:'#111',
            fontFamily:'monospace', letterSpacing:'3px', textTransform:'uppercase',
          }}>
            {player.name}
          </div>
          <div style={{
            fontSize:'0.65rem', color:ACCENT, fontFamily:'monospace',
            letterSpacing:'4px', marginTop:'4px',
          }}>
            {rank.version}
          </div>

          {/* XP progress to next level */}
          <div style={{marginTop:'14px'}}>
            <div style={{display:'flex', justifyContent:'space-between', marginBottom:'5px'}}>
              <span style={{fontSize:'0.6rem', color:'#888', fontFamily:'monospace', letterSpacing:'1px'}}>
                {rank.into} / {rank.need} XP
              </span>
              <span style={{fontSize:'0.6rem', color:'#888', fontFamily:'monospace', letterSpacing:'1px'}}>
                {rank.nextVersion} →
              </span>
            </div>
            <div style={{height:'6px', background:'#eee', borderRadius:'3px', overflow:'hidden'}}>
              <div style={{height:'100%', width:`${rank.pct}%`, background:ACCENT, transition:'width 0.4s'}}/>
            </div>
          </div>

          {/* Momentum — reward the streak */}
          {streak>0 && (
            <div style={{
              marginTop:'10px', fontSize:'0.62rem', fontFamily:'monospace',
              letterSpacing:'1px', color:'#F5A623',
            }}>
              🔥 {streak}-day streak · {mult.toFixed(1)}x momentum
            </div>
          )}

          <div style={{
            display:'flex', gap:'0', marginTop:'20px',
            borderTop:'1px solid #e5e5e5', borderBottom:'1px solid #e5e5e5',
          }}>
            {[
              {label:'xp',      val:xp.toLocaleString()},
              {label:'streak',  val:streak},
              {label:'version', val:rank.version},
            ].map(({label,val},i,arr)=>(
              <div key={label} style={{
                flex:1, padding:'12px 0', textAlign:'center',
                borderRight: i<arr.length-1 ? '1px solid #e5e5e5' : 'none',
              }}>
                <div style={{fontSize:'1rem', fontWeight:700, color:ACCENT, fontFamily:'monospace'}}>{val}</div>
                <div style={{fontSize:'0.6rem', color:'#888', fontFamily:'monospace', letterSpacing:'2px', marginTop:'2px'}}>{label}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{
          display:'flex', justifyContent:'space-between', alignItems:'baseline',
          marginBottom:'4px',
        }}>
          <span style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace', letterSpacing:'3px'}}>
            today's card
            {!view.submitted && (
              <button onClick={()=>{ clearCard(player.id); setCard(null); }} aria-label="Re-pick today's chores" style={{
                marginLeft:'10px', background:'none', border:'none', color:ACCENT,
                fontSize:'0.62rem', cursor:'pointer', fontFamily:'monospace', letterSpacing:'1px',
              }}>↻ re-pick</button>
            )}
          </span>
          <span style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace'}}>
            {doneCount}/{view.chores.length} · {totalMin}m
          </span>
        </div>

        <div style={{marginBottom:'16px'}}>
          {view.chores.map((chore,i) => (
            <ChoreRow key={chore.id} chore={chore}
              checked={view.checked[i]}
              status={choreStatus(chore)}
              onToggle={()=>toggle(i)}/>
          ))}
        </div>

        {bonusRows.length>0 && (
          <div style={{marginBottom:'16px'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'4px'}}>
              <span style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace', letterSpacing:'3px'}}>
                bonus round
              </span>
              <span style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace'}}>
                {bonusRows.length} · {bonusMin}m
              </span>
            </div>
            {bonusRows.map(chore => (
              <ChoreRow key={chore.id} chore={chore}
                checked={true}
                status={statusByChore[chore.id] || 'pending'}
                onToggle={()=>{}}/>
            ))}
          </div>
        )}

        {view.chores.some(c=>c.escalLevel>0) && (
          <div style={{fontSize:'0.62rem', color:'#777', fontFamily:'monospace', letterSpacing:'1px', marginBottom:'16px'}}>
            ! = neglected &nbsp; !! = long overdue
          </div>
        )}

        {pending>0 && !view.submitted && (
          <div style={{
            padding:'10px 14px', border:'1px solid #F5A623',
            fontSize:'0.72rem', color:'#F5A623', fontFamily:'monospace',
            letterSpacing:'1px', marginBottom:'16px',
          }}>
            ! {pending} chore{pending>1?'s':''} pending approval
          </div>
        )}

        <div style={{paddingBottom:'40px'}}>
          {view.submitted ? (() => {
            // Reflect what the parent has actually done, not just "submitted".
            const allApproved = nApproved===nTotal;
            const someApproved = nApproved>0 && nApproved<nTotal;
            const bonusPts = bonusRows.filter(c=>statusByChore[c.id]==='approved').reduce((s,c)=>s+(c.pts||0),0);
            const color = nRejected>0 ? '#EF4444' : allApproved ? '#16A34A' : ACCENT;
            const label = nRejected>0
              ? `${nRejected} REJECTED · ${nApproved}/${nTotal} APPROVED`
              : allApproved
                ? `ALL APPROVED ✓ · +${view.chores.reduce((s,c)=>s+(c.pts||0),0)+bonusPts} PTS`
                : someApproved
                  ? `${nApproved}/${nTotal} APPROVED · REST AWAITING`
                  : 'SUBMITTED — AWAITING APPROVAL';
            return (
              <React.Fragment>
                <div style={{
                  padding:'16px', textAlign:'center',
                  border:`1px solid ${color}`,
                  fontSize:'0.72rem', color, fontFamily:'monospace', letterSpacing:'3px',
                }}>
                  {label}
                </div>
                {bonusLeft>0 && (
                  <button onClick={()=>setBonusPicking(true)} style={{
                    width:'100%', padding:'15px', marginTop:'10px', cursor:'pointer',
                    background:'transparent', border:`1px solid ${ACCENT}`, color:ACCENT,
                    fontSize:'0.72rem', fontWeight:800, letterSpacing:'3px', fontFamily:'monospace',
                  }}>
                    ➕ BONUS ROUND — LOG MORE
                  </button>
                )}
              </React.Fragment>
            );
          })() : (
            <button onClick={submit} disabled={!allChecked||submitting} style={{
              width:'100%', padding:'17px', cursor:allChecked?'pointer':'default',
              background: allChecked ? ACCENT : 'transparent',
              border:`1px solid ${allChecked ? ACCENT : '#e0e0e0'}`,
              color: allChecked ? '#fff' : '#aaa',
              fontSize:'0.75rem', fontWeight:800, letterSpacing:'3px',
              fontFamily:'monospace', transition:'all 0.15s',
            }}>
              {submitting ? 'SUBMITTING...' : allChecked ? 'SUBMIT CARD' : `CHECK OFF ALL ${card.chores.length} CHORES`}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── DAILY LOG ───────────────────────────────────────────────────────────────
// A HelloHabit-style "who cleared 25 minutes today" grid for the home page. One
// row per player: a filled cell for every day they completed ≥25 minutes of
// approved chores, faded for a partial day, blank for a day off.
function DailyLog({ logs }) {
  const days     = recentDays();
  const anyLogs  = logs.some(l => l.status==='approved');

  return (
    <div style={{width:'100%', maxWidth:'300px', marginTop:'40px'}}>
      <div style={{fontSize:'0.6rem', letterSpacing:'4px', color:'#666', fontFamily:'monospace', textAlign:'center', marginBottom:'4px'}}>
        25-MINUTE DAILY LOG
      </div>
      <div style={{fontSize:'0.54rem', letterSpacing:'1px', color:'#aaa', fontFamily:'monospace', textAlign:'center', marginBottom:'18px'}}>
        last {LOG_DAYS} days · a filled square = ≥25 min approved
      </div>

      {!anyLogs ? (
        <div style={{fontSize:'0.62rem', color:'#999', fontFamily:'monospace', letterSpacing:'1px', textAlign:'center', lineHeight:1.7, padding:'4px 0'}}>
          no approved chores yet —<br/>clear a 25-minute card to start the grid
        </div>
      ) : PLAYERS.map(p => {
        const byDay = minutesByDay(p.id, logs);
        const hits  = days.filter(d => (byDay[d]||0) >= DAILY_MINUTES).length;
        const pct   = Math.round(hits / LOG_DAYS * 100);
        return (
          <div key={p.id} style={{marginBottom:'18px'}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:'7px'}}>
              <div style={{fontSize:'0.72rem', fontWeight:700, color:'#111', fontFamily:'monospace', letterSpacing:'1px'}}>{p.name}</div>
              <div style={{fontSize:'0.66rem', fontWeight:700, color:ACCENT, fontFamily:'monospace'}}>{hits}/{LOG_DAYS} · {pct}%</div>
            </div>
            <div style={{display:'grid', gridTemplateColumns:`repeat(${LOG_DAYS}, 1fr)`, gap:'2px'}}>
              {days.map((d,i) => {
                const mins    = byDay[d] || 0;
                const frac    = Math.min(mins / DAILY_MINUTES, 1);
                const isToday = i === days.length-1;
                const bg      = mins === 0 ? '#ededed' : `rgba(242,56,97,${(0.30 + frac*0.70).toFixed(2)})`;
                return (
                  <div key={d}
                    title={`${new Date(d).toLocaleDateString()} — ${mins} min${mins>=DAILY_MINUTES?' ✓':''}`}
                    style={{
                      aspectRatio:'1', borderRadius:'2px', background:bg,
                      boxShadow: isToday ? `0 0 0 1px ${mins>=DAILY_MINUTES?ACCENT:'#bbb'}` : 'none',
                    }}/>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── ADMIN MODAL ─────────────────────────────────────────────────────────────
function AdminModal({ logs, onClose, onUpdate }) {
  const [code, setCode]   = useState('');
  const [authed, setAuth] = useState(false);
  const [filter, setFilt] = useState('pending');
  const [armed, setArmed] = useState(false);   // approve-all needs a second tap
  const pendingAll = logs.filter(l=>l.status==='pending');

  const verify = () => { if (hashCode(code)===ADMIN_CODE_HASH) setAuth(true); };
  const shown  = logs.filter(l=>filter==='all'||l.status===filter).slice(0,60);

  if (!authed) return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.97)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:'24px'}}>
      <div style={{background:'#fff',border:'1px solid #e0e0e0',padding:'32px',width:'100%',maxWidth:'300px',textAlign:'center'}}>
        <div style={{fontSize:'0.65rem',letterSpacing:'5px',color:'#888',fontFamily:'monospace',marginBottom:'24px'}}>ADMIN ACCESS</div>
        <input type="password" value={code} onChange={e=>setCode(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&verify()} placeholder="——" autoFocus
          style={{width:'100%',padding:'14px',background:'#f5f5f5',border:'1px solid #e0e0e0',color:'#111',fontSize:'1.4rem',textAlign:'center',fontFamily:'monospace',outline:'none',letterSpacing:'8px',marginBottom:'16px'}}/>
        <button onClick={verify} style={{width:'100%',padding:'13px',background:ACCENT,border:'none',color:'#fff',fontWeight:800,fontSize:'0.75rem',letterSpacing:'3px',fontFamily:'monospace',cursor:'pointer'}}>ENTER</button>
        <button onClick={onClose} style={{width:'100%',padding:'13px',background:'none',border:'none',color:'#888',fontSize:'0.72rem',cursor:'pointer',fontFamily:'monospace',marginTop:'6px'}}>cancel</button>
      </div>
    </div>
  );

  return (
    <div style={{position:'fixed',inset:0,background:'#fff',display:'flex',flexDirection:'column',zIndex:200}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px',borderBottom:'1px solid #e5e5e5',flexShrink:0}}>
        <div style={{fontSize:'0.65rem',letterSpacing:'4px',color:ACCENT,fontFamily:'monospace'}}>ADMIN</div>
        <button onClick={onClose} aria-label="Close admin panel" style={{background:'none',border:'none',color:'#999',fontSize:'0.78rem',cursor:'pointer',fontFamily:'monospace'}}>✕ close</button>
      </div>

      <div style={{display:'flex',gap:'8px',padding:'12px 20px',borderBottom:'1px solid #e5e5e5',flexShrink:0,flexWrap:'wrap'}}>
        {['pending','approved','rejected','all'].map(f=>(
          <button key={f} onClick={()=>setFilt(f)} style={{
            padding:'5px 12px', cursor:'pointer',
            background: filter===f ? ACCENT : 'transparent',
            border:`1px solid ${filter===f ? ACCENT : '#e0e0e0'}`,
            color: filter===f ? '#000' : '#999',
            fontSize:'0.68rem', fontWeight:700, letterSpacing:'1px', fontFamily:'monospace',
          }}>{f}</button>
        ))}
      </div>

      {filter==='pending' && pendingAll.length>1 && (
        <div style={{padding:'12px 20px 0',flexShrink:0}}>
          <button
            onClick={()=>{
              if (!armed) { setArmed(true); setTimeout(()=>setArmed(false), 4000); return; }
              pendingAll.forEach(l=>onUpdate(l.id,'approved')); setArmed(false);
            }}
            style={{width:'100%',padding:'11px',cursor:'pointer',
              background: armed ? '#22C55E' : 'transparent', border:'1px solid #22C55E',
              color: armed ? '#fff' : '#22C55E',
              fontSize:'0.7rem',fontWeight:800,letterSpacing:'2px',fontFamily:'monospace'}}>
            {armed ? `TAP AGAIN TO APPROVE ALL ${pendingAll.length}` : `✓ APPROVE ALL (${pendingAll.length})`}
          </button>
        </div>
      )}

      <div className="scroll" style={{flex:1,padding:'16px 20px'}}>
        {shown.length===0 && (
          <div style={{textAlign:'center',color:'#666',fontFamily:'monospace',fontSize:'0.78rem',marginTop:'48px',letterSpacing:'2px'}}>
            no {filter} logs
          </div>
        )}
        {shown.map(log => (
          <div key={log.id} style={{border:'1px solid #e5e5e5',padding:'14px 16px',marginBottom:'8px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}}>
              <div>
                <div style={{fontSize:'0.87rem',fontWeight:600,color:'#111',fontFamily:'monospace'}}>{log.choreName}</div>
                <div style={{fontSize:'0.68rem',color:'#888',fontFamily:'monospace',marginTop:'3px'}}>
                  {log.playerName} · {new Date(log.timestamp).toLocaleString()}
                </div>
              </div>
              <div style={{fontSize:'0.75rem',fontWeight:700,color:ACCENT,fontFamily:'monospace',flexShrink:0,marginLeft:'12px'}}>
                {log.points}pts
              </div>
            </div>
            {log.status==='pending' ? (
              <div style={{display:'flex',gap:'8px'}}>
                <button onClick={()=>onUpdate(log.id,'approved')} style={{flex:1,padding:'9px',background:'transparent',border:'1px solid #22C55E',color:'#22C55E',fontSize:'0.7rem',fontWeight:700,cursor:'pointer',fontFamily:'monospace',letterSpacing:'1px'}}>APPROVE</button>
                <button onClick={()=>onUpdate(log.id,'rejected')} style={{flex:1,padding:'9px',background:'transparent',border:'1px solid #EF4444',color:'#EF4444',fontSize:'0.7rem',fontWeight:700,cursor:'pointer',fontFamily:'monospace',letterSpacing:'1px'}}>REJECT</button>
              </div>
            ) : (
              <div style={{fontSize:'0.68rem',color:log.status==='approved'?'#22C55E':'#EF4444',fontFamily:'monospace',letterSpacing:'1px'}}>{log.status}</div>
            )}
          </div>
        ))}
        <div style={{height:'40px'}}/>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [player,    setPlayer]  = useState(null);
  // #admin deep-links straight to the approval panel (the Discord messages
  // link here). It only skips the 5-tap gesture — the admin code still gates.
  const [showAdmin, setAdmin]   = useState(() => window.location.hash === '#admin');
  const [logs,      setLogs]    = useState(loadLogs);
  const [syncStatus,setSyncSt]  = useState(supabase?'idle':'offline');
  const [buildStatus,setBuild]  = useState('unknown');   // 'latest' | 'stale' | 'unknown'

  // One sync at a time. The 5s poll, visibility/online events, and a fresh
  // submission can all fire while a sync is mid-insert; a second pass would
  // re-read localStorage, still see the rows without a remoteId, and insert
  // them again — that is how duplicate chores reached the server. Overlapping
  // requests are coalesced into a single follow-up run instead.
  const syncing   = useRef(false);
  const syncAgain = useRef(false);
  const sync = useCallback(async () => {
    if (!supabase) { setSyncSt('offline'); return; }
    if (syncing.current) { syncAgain.current = true; return; }
    syncing.current = true;
    setSyncSt('syncing');
    let work = loadLogs();
    try {
      for (const l of work.filter(x=>x.remoteId==null)) {
        const {data,error} = await supabase.from('simple_logs').insert(toRow(l)).select().single();
        if (error) throw error;
        l.remoteId=data.id; l.synced=true; l.statusDirty=false;
        if (data.created_at) l.timestamp=data.created_at;
      }
      // Push status changes (approve/reject). Confirm with .select() and clear
      // the dirty flag only when a row was actually updated — a silently dropped
      // update (0 rows, no error) is left dirty so it retries instead of vanishing.
      for (const l of work.filter(x=>x.remoteId!=null&&x.statusDirty)) {
        const {data,error} = await supabase.from('simple_logs').update({status:l.status}).eq('id',l.remoteId).select();
        if (error) throw error;
        if (data && data.length) l.statusDirty=false;
      }
      const {data:rows,error:selErr} = await supabase.from('simple_logs').select('*').order('created_at',{ascending:false});
      if (selErr) throw selErr;
      const remoteIds=new Set((rows||[]).map(r=>String(r.id)));
      // Self-heal orphaned rows: if a dirty log points at a remote row that no
      // longer exists (e.g. the table was reset), the update can never land —
      // recreate the row so the approval actually propagates.
      for (const l of work) {
        if (l.statusDirty && l.remoteId!=null && !remoteIds.has(String(l.remoteId))) {
          const {data,error} = await supabase.from('simple_logs').insert(toRow(l)).select().single();
          if (error) throw error;
          l.remoteId=data.id; l.synced=true; l.statusDirty=false;
          if (data.created_at) l.timestamp=data.created_at;
          remoteIds.add(String(data.id));
        }
      }
      const byRemote={};
      work.forEach(l=>{if(l.remoteId!=null) byRemote[String(l.remoteId)]=l;});
      (rows||[]).forEach(r=>{
        const ex=byRemote[String(r.id)];
        if(ex){if(!ex.statusDirty) ex.status=r.status;} else work.push(rowToLocal(r));
      });
      // Re-apply changes made locally while this sync was in flight. Only when
      // the status genuinely differs, so we never re-dirty (and re-push forever)
      // a change we just confirmed.
      const latest=loadLogs(), workById={};
      work.forEach(l=>{workById[l.id]=l;});
      latest.forEach(l=>{
        if(!workById[l.id]) work.push(l);
        else if(l.statusDirty && workById[l.id].status!==l.status){workById[l.id].status=l.status; workById[l.id].statusDirty=true;}
      });
      work.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
      saveLogs(work); setLogs(work.slice()); setSyncSt('synced');
    } catch(e) {
      console.warn('sync deferred:', e?.message||e); setSyncSt('offline');
    } finally {
      syncing.current = false;
      if (syncAgain.current) { syncAgain.current = false; sync(); }
    }
  }, []);

  useEffect(()=>{sync();},[sync]);

  // Compare this running build against the live one. Fetch index.html fresh
  // (cache-busted, no-store) and read its BUILD constant — if it differs, this
  // copy is stale (a newer build is deployed but we're running a cached one).
  useEffect(()=>{
    let cancelled=false;
    const check=()=>{
      fetch(`/index.html?cb=${Date.now()}`, {cache:'no-store'})
        .then(r=> r.ok ? r.text() : Promise.reject())
        .then(txt=>{
          if (cancelled) return;
          const m = txt.match(/const BUILD\s*=\s*'([^']+)'/);
          if (m) setBuild(m[1]===BUILD ? 'latest' : 'stale');
        })
        .catch(()=>{ if(!cancelled) setBuild('unknown'); });
    };
    check();
    const t=setInterval(check, 60000);
    return ()=>{ cancelled=true; clearInterval(t); };
  },[]);

  useEffect(()=>{
    const t=setInterval(sync,5000);
    const onVis=()=>{if(!document.hidden) sync();};
    const onOnl=()=>sync();
    const onSto=e=>{if(e.key===STORAGE_KEY) setLogs(loadLogs());};
    document.addEventListener('visibilitychange',onVis);
    window.addEventListener('online',onOnl);
    window.addEventListener('storage',onSto);
    return ()=>{clearInterval(t); document.removeEventListener('visibilitychange',onVis); window.removeEventListener('online',onOnl); window.removeEventListener('storage',onSto);};
  },[sync]);

  const submitCard = useCallback(async (chores) => {
    const now = Date.now();
    const newLogs = chores.map((c,i) => ({
      id:makeId(), remoteId:null, synced:false, statusDirty:false,
      playerId:player.id, playerName:player.name,
      choreId:c.id, choreName:c.name, choreIcon:'',
      points:c.pts, minutes:c.currentMinutes, timestamp:new Date(now+i).toISOString(), status:'pending',
    }));
    const next = [...newLogs, ...loadLogs()].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    saveLogs(next); setLogs(next); sync();
  }, [player, sync]);

  const updateLog = useCallback((localId, status) => {
    const work = loadLogs().map(l=>l.id===localId?{...l,status,statusDirty:true}:l);
    saveLogs(work); setLogs(work.slice()); sync();
  }, [sync]);

  // Tapping the approval link while the app is already open lands here as a
  // hash change on the existing tab — open the panel then too.
  useEffect(() => {
    const onHash = () => { if (window.location.hash === '#admin') setAdmin(true); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const closeAdmin = () => {
    setAdmin(false);
    if (window.location.hash === '#admin') history.replaceState(null, '', window.location.pathname);
  };

  return (
    <div style={{height:'100%'}}>
      {showAdmin && <AdminModal logs={logs} onClose={closeAdmin} onUpdate={updateLog}/>}
      {!showAdmin && !player && <PlayerSelect onSelect={setPlayer} onAdmin={()=>setAdmin(true)} logs={logs}/>}
      {!showAdmin && player && (
        <PlayerCardView
          player={player} logs={logs}
          onBack={()=>{setPlayer(null); sync();}}
          onSubmitCard={submitCard}
          syncStatus={syncStatus}
          buildStatus={buildStatus}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
// Register the service worker so the app shell is cached for offline use and
// fast repeat loads. Kept out of the Babel script so it runs even if JSX
// transform is slow, and failures are non-fatal (the app works without it).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(err =>
      console.warn('Service worker registration failed:', err)
    );
  });
}
</script>
</body>
