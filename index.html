<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0A0A0F">
    <title>GyattChores</title>
    <link rel="icon" type="image/svg+xml" href="gyattchores-logo-transparent.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0A0A0F;
            --surface: #16161D;
            --surface-elevated: #1E1E28;
            --text: #F8FAFC;
            --text-secondary: #94A3B8;
            --cyan: #22D3EE;
            --cyan-glow: rgba(34, 211, 238, 0.15);
            --green: #22C55E;
            --red: #EF4444;
            --purple: #A855F7;
            --radius: 16px;
            --radius-lg: 24px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root {
            height: 100%;
        }

        /* Safe area for notch */
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .animate-pop {
            animation: pop 0.3s ease-out;
        }

        .animate-fade {
            animation: fadeIn 0.2s ease-out;
        }

        /* Hide scrollbar but allow scroll */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // ============================================
        // DATA
        // ============================================

        const PLAYERS = [
            { id: '1', name: 'BeKindHearted', avatar: '🦁' },
            { id: '2', name: 'MegoDinoLava', avatar: '🦖' }
        ];

        const CHORES = [
            { id: '1', name: 'Pick up Poop', points: 500, icon: '💩' },
            { id: '2', name: 'Vacuum', points: 500, icon: '🧹' },
            { id: '3', name: 'Get Mail', points: 250, icon: '📬' },
            { id: '4', name: 'Trash', points: 375, icon: '🗑️' },
            { id: '5', name: 'Dishes', points: 500, icon: '🍽️' },
            { id: '6', name: 'Load Dishwasher', points: 625, icon: '🫧' },
            { id: '7', name: 'Unload Dishwasher', points: 500, icon: '✨' },
            { id: '8', name: 'Clean Room', points: 750, icon: '🛏️' },
            { id: '9', name: 'Clean Bathroom', points: 750, icon: '🚿' },
            { id: '10', name: 'Water Plants', points: 250, icon: '🌱' },
            { id: '11', name: 'Feed Alfred', points: 250, icon: '🐕' },
            { id: '12', name: 'Feed Chevy', points: 250, icon: '🐱' },
            { id: '13', name: 'Sweep', points: 375, icon: '🧹' },
            { id: '14', name: 'Wipe Counters', points: 375, icon: '🧽' },
            { id: '15', name: 'Fold Laundry', points: 500, icon: '👕' },
            { id: '16', name: 'Set Table', points: 250, icon: '🍴' },
            { id: '17', name: 'Clear Table', points: 250, icon: '🧹' }
        ];

        const ADMIN_CODE = '7874';

        // ============================================
        // SHARED BACKEND (Supabase)
        // ============================================
        // Logs are stored in a shared Supabase table so every device (each kid's
        // phone + the parent's admin screen) sees the same data. Without this,
        // logs only live in one device's localStorage and never sync.

        const supabase = window.supabase.createClient(
            'https://ukshxdoqgwoxobjdclpx.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrc2h4ZG9xZ3dveG9iamRjbHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3MjI2NDEsImV4cCI6MjA4MDI5ODY0MX0.UGNrsfG6goEA0PPWG4x7gxBueA7D5Oe9uWI-iCXIar0'
        );

        // Map a Supabase row (snake_case) to the app's log shape (camelCase).
        const rowToLog = (r) => ({
            id: r.id,
            playerId: r.player_id,
            playerName: r.player_name,
            choreId: r.chore_id,
            choreName: r.chore_name,
            choreIcon: r.chore_icon,
            points: r.points,
            timestamp: r.created_at,
            status: r.status
        });

        // ============================================
        // MAIN APP
        // ============================================

        function App() {
            const [selectedPlayer, setSelectedPlayer] = useState(null);
            const [logs, setLogs] = useState([]);
            const [showSuccess, setShowSuccess] = useState(null);
            const [showAdmin, setShowAdmin] = useState(false);
            const [connected, setConnected] = useState(true);

            // Pull the shared logs from Supabase so every device stays in sync.
            const fetchLogs = useCallback(async () => {
                const { data, error } = await supabase
                    .from('simple_logs')
                    .select('*')
                    .order('created_at', { ascending: false });
                if (error) {
                    console.error('Failed to load logs:', error.message);
                    setConnected(false);
                    return;
                }
                setConnected(true);
                setLogs(data.map(rowToLog));
            }, []);

            // Initial load + keep in sync: poll periodically and refetch whenever
            // the tab regains focus (e.g. parent reopens the admin screen).
            useEffect(() => {
                fetchLogs();
                const interval = setInterval(fetchLogs, 4000);
                const onVisible = () => {
                    if (document.visibilityState === 'visible') fetchLogs();
                };
                document.addEventListener('visibilitychange', onVisible);
                return () => {
                    clearInterval(interval);
                    document.removeEventListener('visibilitychange', onVisible);
                };
            }, [fetchLogs]);

            // Calculate points
            const getWeeklyPoints = (playerId) => {
                const weekStart = new Date();
                weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
                weekStart.setHours(0, 0, 0, 0);

                return logs
                    .filter(log =>
                        log.playerId === playerId &&
                        log.status === 'approved' &&
                        new Date(log.timestamp) >= weekStart
                    )
                    .reduce((sum, log) => sum + log.points, 0);
            };

            const getTodayPoints = (playerId) => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                return logs
                    .filter(log =>
                        log.playerId === playerId &&
                        log.status === 'approved' &&
                        new Date(log.timestamp) >= today
                    )
                    .reduce((sum, log) => sum + log.points, 0);
            };

            const pendingLogs = logs.filter(log => log.status === 'pending');

            const leader = PLAYERS.reduce((best, player) => {
                const pts = getWeeklyPoints(player.id);
                if (!best || pts > best.pts) return { player, pts };
                return best;
            }, null);

            // Log a chore
            const logChore = async (chore) => {
                if (!selectedPlayer) return;

                // Show success immediately for a snappy, frictionless feel.
                setShowSuccess(chore);
                if (navigator.vibrate) navigator.vibrate(10);
                setTimeout(() => setShowSuccess(null), 1500);

                const { data, error } = await supabase
                    .from('simple_logs')
                    .insert({
                        player_id: selectedPlayer.id,
                        player_name: selectedPlayer.name,
                        chore_id: chore.id,
                        chore_name: chore.name,
                        chore_icon: chore.icon,
                        points: chore.points,
                        status: 'pending'
                    })
                    .select()
                    .single();

                if (error) {
                    console.error('Failed to log chore:', error.message);
                    setConnected(false);
                    alert('Could not save that chore — reconnecting. Please try again in a moment.');
                    return;
                }

                // Add the saved row locally right away; polling keeps others in sync.
                setConnected(true);
                setLogs(prev => [rowToLog(data), ...prev]);
            };

            // Approve/reject — update the shared row, then reflect locally.
            const setStatus = async (logId, status) => {
                setLogs(prev => prev.map(log =>
                    log.id === logId ? { ...log, status } : log
                ));
                const { error } = await supabase
                    .from('simple_logs')
                    .update({ status })
                    .eq('id', logId);
                if (error) {
                    console.error('Failed to update log:', error.message);
                    setConnected(false);
                    fetchLogs(); // revert to server truth on failure
                } else {
                    setConnected(true);
                }
            };

            const approve = (logId) => {
                if (navigator.vibrate) navigator.vibrate([10, 50, 10]);
                setStatus(logId, 'approved');
            };

            const reject = (logId) => {
                setStatus(logId, 'rejected');
            };

            const approveAll = async () => {
                if (navigator.vibrate) navigator.vibrate([10, 50, 10]);
                const ids = pendingLogs.map(log => log.id);
                if (ids.length === 0) return;
                setLogs(prev => prev.map(log =>
                    log.status === 'pending' ? { ...log, status: 'approved' } : log
                ));
                const { error } = await supabase
                    .from('simple_logs')
                    .update({ status: 'approved' })
                    .in('id', ids);
                if (error) {
                    console.error('Failed to approve all:', error.message);
                    setConnected(false);
                    fetchLogs();
                } else {
                    setConnected(true);
                }
            };

            return (
                <div style={{
                    height: '100%',
                    display: 'flex',
                    flexDirection: 'column',
                    background: 'var(--bg)'
                }}>
                    {/* Header */}
                    <header style={{
                        padding: '16px 20px',
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        borderBottom: '1px solid var(--surface)'
                    }}>
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '12px'
                        }}>
                            <img
                                src="gyattchores-logo-transparent.svg"
                                alt="GyattChores Logo"
                                style={{
                                    width: '32px',
                                    height: '32px'
                                }}
                            />
                            <h1 style={{
                                fontSize: '1.5rem',
                                fontWeight: 700,
                                background: 'linear-gradient(135deg, var(--cyan), var(--purple))',
                                WebkitBackgroundClip: 'text',
                                WebkitTextFillColor: 'transparent'
                            }}>
                                GyattChores
                            </h1>
                        </div>
                        <button
                            onClick={() => setShowAdmin(true)}
                            style={{
                                background: 'var(--surface)',
                                border: 'none',
                                borderRadius: '12px',
                                padding: '10px 14px',
                                color: 'var(--text)',
                                fontSize: '1rem',
                                cursor: 'pointer',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '8px',
                                position: 'relative'
                            }}
                        >
                            <span>✓</span>
                            {pendingLogs.length > 0 && (
                                <span style={{
                                    position: 'absolute',
                                    top: '-6px',
                                    right: '-6px',
                                    background: 'var(--red)',
                                    color: 'white',
                                    fontSize: '0.7rem',
                                    fontWeight: 700,
                                    padding: '2px 6px',
                                    borderRadius: '10px',
                                    minWidth: '18px',
                                    textAlign: 'center'
                                }}>
                                    {pendingLogs.length}
                                </span>
                            )}
                        </button>
                    </header>

                    {/* Reconnecting indicator — shown whenever the shared backend is unreachable */}
                    {!connected && (
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: '8px',
                            padding: '8px 16px',
                            background: 'rgba(245, 158, 11, 0.15)',
                            color: 'var(--amber, #f59e0b)',
                            borderBottom: '1px solid rgba(245, 158, 11, 0.3)',
                            fontSize: '0.85rem',
                            fontWeight: 600
                        }}>
                            <span style={{
                                width: '8px',
                                height: '8px',
                                borderRadius: '50%',
                                background: 'currentColor',
                                animation: 'pulse 1.2s ease-in-out infinite'
                            }} />
                            Reconnecting…
                        </div>
                    )}

                    {/* Main Content */}
                    <main style={{
                        flex: 1,
                        overflow: 'auto',
                        padding: '20px'
                    }}>
                        {/* Player Selection */}
                        <div style={{
                            display: 'flex',
                            gap: '12px',
                            marginBottom: '20px'
                        }}>
                            {PLAYERS.map(player => (
                                <PlayerCard
                                    key={player.id}
                                    player={player}
                                    isSelected={selectedPlayer?.id === player.id}
                                    isLeader={leader?.player.id === player.id && leader.pts > 0}
                                    points={getWeeklyPoints(player.id)}
                                    onClick={() => setSelectedPlayer(player)}
                                />
                            ))}
                        </div>

                        {/* Stats */}
                        {selectedPlayer && (
                            <div style={{
                                display: 'flex',
                                gap: '12px',
                                marginBottom: '24px'
                            }} className="animate-fade">
                                <StatPill
                                    label="Today"
                                    value={getTodayPoints(selectedPlayer.id)}
                                    color="orange"
                                />
                                <StatPill
                                    label="This Week"
                                    value={getWeeklyPoints(selectedPlayer.id)}
                                    color="cyan"
                                />
                            </div>
                        )}

                        {/* Chores Grid */}
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: 'repeat(2, 1fr)',
                            gap: '12px'
                        }}>
                            {CHORES.map(chore => (
                                <ChoreCard
                                    key={chore.id}
                                    chore={chore}
                                    disabled={!selectedPlayer}
                                    onClick={() => logChore(chore)}
                                />
                            ))}
                        </div>
                    </main>

                    {/* Success Overlay */}
                    {showSuccess && (
                        <div style={{
                            position: 'fixed',
                            inset: 0,
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            background: 'rgba(0,0,0,0.6)',
                            backdropFilter: 'blur(8px)',
                            zIndex: 100
                        }} className="animate-pop">
                            <div style={{
                                background: 'var(--surface)',
                                borderRadius: 'var(--radius-lg)',
                                padding: '40px',
                                textAlign: 'center'
                            }}>
                                <div style={{ fontSize: '4rem', marginBottom: '16px' }}>
                                    {showSuccess.icon}
                                </div>
                                <div style={{ fontSize: '1.5rem', fontWeight: 700, marginBottom: '8px' }}>
                                    Logged!
                                </div>
                                <div style={{ color: 'var(--cyan)', fontWeight: 600 }}>
                                    +{showSuccess.points} pts
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Modal */}
                    {showAdmin && (
                        <AdminModal
                            logs={pendingLogs}
                            onApprove={approve}
                            onReject={reject}
                            onApproveAll={approveAll}
                            onClose={() => setShowAdmin(false)}
                        />
                    )}
                </div>
            );
        }

        // ============================================
        // COMPONENTS
        // ============================================

        function PlayerCard({ player, isSelected, isLeader, points, onClick }) {
            return (
                <button
                    onClick={onClick}
                    style={{
                        flex: 1,
                        background: isSelected ? 'var(--cyan-glow)' : 'var(--surface)',
                        border: isSelected ? '2px solid var(--cyan)' : '2px solid transparent',
                        borderRadius: 'var(--radius-lg)',
                        padding: '20px 16px',
                        cursor: 'pointer',
                        textAlign: 'center',
                        transition: 'all 0.2s ease',
                        transform: isSelected ? 'scale(1.02)' : 'scale(1)'
                    }}
                >
                    <div style={{ position: 'relative', display: 'inline-block' }}>
                        <span style={{ fontSize: '3rem' }}>{player.avatar}</span>
                        {isLeader && (
                            <span style={{
                                position: 'absolute',
                                top: '-8px',
                                right: '-12px',
                                fontSize: '1.2rem'
                            }}>👑</span>
                        )}
                    </div>
                    <div style={{
                        color: 'var(--text)',
                        fontWeight: 600,
                        marginTop: '8px',
                        fontSize: '0.9rem'
                    }}>
                        {player.name}
                    </div>
                    <div style={{
                        color: 'var(--text-secondary)',
                        fontSize: '0.8rem',
                        marginTop: '4px'
                    }}>
                        {points} pts
                    </div>
                </button>
            );
        }

        function StatPill({ label, value, color }) {
            const colors = {
                orange: '#F59E0B',
                cyan: 'var(--cyan)'
            };

            return (
                <div style={{
                    background: 'var(--surface)',
                    borderRadius: '100px',
                    padding: '10px 16px',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '10px'
                }}>
                    <span style={{
                        width: '8px',
                        height: '8px',
                        borderRadius: '50%',
                        background: colors[color]
                    }} />
                    <div>
                        <div style={{ fontWeight: 700, fontSize: '1rem' }}>{value}</div>
                        <div style={{ color: 'var(--text-secondary)', fontSize: '0.75rem' }}>{label}</div>
                    </div>
                </div>
            );
        }

        function ChoreCard({ chore, disabled, onClick }) {
            const [isPressed, setIsPressed] = useState(false);

            return (
                <button
                    onClick={onClick}
                    disabled={disabled}
                    onTouchStart={() => setIsPressed(true)}
                    onTouchEnd={() => setIsPressed(false)}
                    onMouseDown={() => setIsPressed(true)}
                    onMouseUp={() => setIsPressed(false)}
                    onMouseLeave={() => setIsPressed(false)}
                    style={{
                        background: 'var(--surface)',
                        border: 'none',
                        borderRadius: 'var(--radius)',
                        padding: '20px 12px',
                        cursor: disabled ? 'not-allowed' : 'pointer',
                        textAlign: 'center',
                        opacity: disabled ? 0.4 : 1,
                        transition: 'transform 0.1s ease',
                        transform: isPressed ? 'scale(0.95)' : 'scale(1)'
                    }}
                >
                    <div style={{ fontSize: '2.2rem', marginBottom: '8px' }}>
                        {chore.icon}
                    </div>
                    <div style={{
                        color: 'var(--text)',
                        fontWeight: 500,
                        fontSize: '0.85rem',
                        marginBottom: '4px',
                        lineHeight: 1.3
                    }}>
                        {chore.name}
                    </div>
                    <div style={{
                        color: 'var(--cyan)',
                        fontWeight: 700,
                        fontSize: '0.8rem'
                    }}>
                        {chore.points} pts
                    </div>
                </button>
            );
        }

        function AdminModal({ logs, onApprove, onReject, onApproveAll, onClose }) {
            const [code, setCode] = useState('');
            const [unlocked, setUnlocked] = useState(false);
            const [error, setError] = useState(false);

            const checkCode = (value) => {
                setCode(value);
                if (value.length === 4) {
                    if (value === ADMIN_CODE) {
                        setUnlocked(true);
                        if (navigator.vibrate) navigator.vibrate(10);
                    } else {
                        setError(true);
                        setCode('');
                        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                        setTimeout(() => setError(false), 1500);
                    }
                }
            };

            return (
                <div style={{
                    position: 'fixed',
                    inset: 0,
                    background: 'var(--bg)',
                    zIndex: 200,
                    display: 'flex',
                    flexDirection: 'column'
                }}>
                    {/* Header */}
                    <header style={{
                        padding: '16px 20px',
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        borderBottom: '1px solid var(--surface)'
                    }}>
                        <button
                            onClick={onClose}
                            style={{
                                background: 'none',
                                border: 'none',
                                color: 'var(--cyan)',
                                fontSize: '1rem',
                                fontWeight: 600,
                                cursor: 'pointer'
                            }}
                        >
                            Done
                        </button>
                        <h2 style={{ fontSize: '1.1rem', fontWeight: 600 }}>
                            {unlocked ? 'Pending Approval' : 'Admin'}
                        </h2>
                        {unlocked && logs.length > 0 ? (
                            <button
                                onClick={onApproveAll}
                                style={{
                                    background: 'none',
                                    border: 'none',
                                    color: 'var(--green)',
                                    fontSize: '0.9rem',
                                    fontWeight: 600,
                                    cursor: 'pointer'
                                }}
                            >
                                Approve All
                            </button>
                        ) : (
                            <div style={{ width: '80px' }} />
                        )}
                    </header>

                    {/* Content */}
                    <div style={{ flex: 1, overflow: 'auto', padding: '20px' }}>
                        {!unlocked ? (
                            /* Code Entry */
                            <div style={{
                                display: 'flex',
                                flexDirection: 'column',
                                alignItems: 'center',
                                justifyContent: 'center',
                                height: '100%',
                                gap: '24px'
                            }}>
                                <div style={{ fontSize: '4rem' }}>🔐</div>
                                <input
                                    type="password"
                                    inputMode="numeric"
                                    maxLength={4}
                                    value={code}
                                    onChange={(e) => checkCode(e.target.value)}
                                    placeholder="••••"
                                    autoFocus
                                    style={{
                                        background: 'var(--surface)',
                                        border: error ? '2px solid var(--red)' : '2px solid transparent',
                                        borderRadius: '12px',
                                        padding: '16px',
                                        fontSize: '2rem',
                                        fontWeight: 700,
                                        color: 'var(--text)',
                                        textAlign: 'center',
                                        width: '160px',
                                        letterSpacing: '8px',
                                        outline: 'none'
                                    }}
                                />
                                {error && (
                                    <div style={{ color: 'var(--red)', fontSize: '0.9rem' }}>
                                        Wrong code
                                    </div>
                                )}
                            </div>
                        ) : logs.length === 0 ? (
                            /* Empty State */
                            <div style={{
                                display: 'flex',
                                flexDirection: 'column',
                                alignItems: 'center',
                                justifyContent: 'center',
                                height: '100%',
                                gap: '16px',
                                color: 'var(--text-secondary)'
                            }}>
                                <div style={{ fontSize: '4rem' }}>✅</div>
                                <div style={{ fontSize: '1.2rem', fontWeight: 600 }}>All caught up!</div>
                                <div>No chores waiting for approval</div>
                            </div>
                        ) : (
                            /* Pending List */
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                                {logs.map(log => (
                                    <div
                                        key={log.id}
                                        style={{
                                            background: 'var(--surface)',
                                            borderRadius: 'var(--radius)',
                                            padding: '16px',
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '16px'
                                        }}
                                    >
                                        <span style={{ fontSize: '2rem' }}>{log.choreIcon}</span>
                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontWeight: 600 }}>{log.choreName}</div>
                                            <div style={{
                                                color: 'var(--text-secondary)',
                                                fontSize: '0.85rem',
                                                marginTop: '2px'
                                            }}>
                                                {log.playerName}
                                            </div>
                                        </div>
                                        <div style={{
                                            color: 'var(--cyan)',
                                            fontWeight: 700,
                                            marginRight: '8px'
                                        }}>
                                            +{log.points}
                                        </div>
                                        <button
                                            onClick={() => onReject(log.id)}
                                            style={{
                                                background: 'rgba(239, 68, 68, 0.15)',
                                                border: 'none',
                                                borderRadius: '10px',
                                                padding: '10px 14px',
                                                color: 'var(--red)',
                                                fontWeight: 600,
                                                cursor: 'pointer'
                                            }}
                                        >
                                            ✕
                                        </button>
                                        <button
                                            onClick={() => onApprove(log.id)}
                                            style={{
                                                background: 'rgba(34, 197, 94, 0.15)',
                                                border: 'none',
                                                borderRadius: '10px',
                                                padding: '10px 14px',
                                                color: 'var(--green)',
                                                fontWeight: 600,
                                                cursor: 'pointer'
                                            }}
                                        >
                                            ✓
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // RENDER
        // ============================================

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
