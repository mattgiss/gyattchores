// ─── CARD ENGINE ─────────────────────────────────────────────────────────────
const cardKey = id => `gyattchores_card_${id}_${new Date().toDateString()}`;

const neglectDays = (choreId, playerId, logs) => {
  const last = logs
    .filter(l => l.playerId===playerId && l.choreId===choreId && l.status==='approved')
    .sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp))[0];
  return last ? Math.floor((Date.now()-new Date(last.timestamp))/86400000) : 999;
};

const enrichChore = (chore, days) => {
  let tier = 0;
  for (let i = chore.tierDays.length-1; i>=0; i--) { if (days>=chore.tierDays[i]){ tier=i; break; } }
  return { ...chore, neglectDays:days, currentMinutes:chore.tiers[tier], escalLevel:tier };
};

const seededRand = (n) => { const x=Math.sin(n)*10000; return x-Math.floor(x); };

const generateCard = (playerId, logs) => {
  const cached = localStorage.getItem(cardKey(playerId));
  if (cached) return JSON.parse(cached);

  const seed = parseInt(new Date().toDateString().replace(/\D/g,'')) + parseInt(playerId);
  const enriched = CHORE_POOL
    .map(c => enrichChore(c, neglectDays(c.id, playerId, logs)))
    .sort((a,b) => {
      if (b.neglectDays !== a.neglectDays) return b.neglectDays - a.neglectDays;
      return seededRand(seed + a.id.charCodeAt(0)) - seededRand(seed + b.id.charCodeAt(0));
    });

  const selected = [];
  let total = 0;
  for (const c of enriched) {
    if (selected.length >= 3) break;
    if (total + c.currentMinutes <= 27) { selected.push(c); total += c.currentMinutes; }
  }
  for (const c of enriched) {
    if (selected.length >= 3) break;
    if (!selected.find(s => s.id===c.id)) selected.push(c);
  }

  const card = { date:new Date().toDateString(), chores:selected, checked:[false,false,false], submitted:false };
  localStorage.setItem(cardKey(playerId), JSON.stringify(card));
  return card;
};

const saveCard = (playerId, card) => localStorage.setItem(cardKey(playerId), JSON.stringify(card));

// ─── LEVEL / STREAK ──────────────────────────────────────────────────────────
const RANKS      = ['RECRUIT','OPERATOR','RUNNER','GHOST','HACKER','PHANTOM','SPECTER','WRAITH','SHADOW','LEGEND'];
const THRESHOLDS = [0,100,300,600,1000,1500,2500,4000,6000,9000];

const getLevel = pts => {
  for (let i=THRESHOLDS.length-1; i>=0; i--) if (pts>=THRESHOLDS[i]) return {num:i+1, rank:RANKS[i]};
  return {num:1, rank:'RECRUIT'};
};
const getStreak = (playerId, logs) => {
  let streak=0; const d=new Date(); d.setHours(0,0,0,0);
  for (let i=0; i<365; i++) {
    const has = logs.some(l => { const lt=new Date(l.timestamp); lt.setHours(0,0,0,0); return l.playerId===playerId && l.status==='approved' && lt.getTime()===d.getTime(); });
    if (!has) break; streak++; d.setDate(d.getDate()-1);
  }
  return streak;
};
const getTotalPts = (playerId, logs) => logs.filter(l=>l.playerId===playerId&&l.status==='approved').reduce((s,l)=>s+l.points,0);

// ─── CHORE ROW ───────────────────────────────────────────────────────────────
function ChoreRow({ chore, checked, color, glow, onToggle }) {
  const escalLabel = ['','↑','↑↑'][chore.escalLevel]||'';
  const escalColor = ['','#F59E0B','#EF4444'][chore.escalLevel]||'';
  const r = color==='#22D3EE' ? '34,211,238' : '168,85,247';
  return (
    <div onClick={onToggle} style={{
      display:'flex', alignItems:'center', gap:'12px',
      padding:'14px 16px', borderRadius:'8px', marginBottom:'8px',
      background: checked ? `rgba(${r},0.07)` : '#0A1827',
      border:`1px solid ${checked ? color : '#162035'}`,
      cursor:'pointer', transition:'all 0.15s',
      boxShadow: checked ? `0 0 12px ${glow}` : 'none',
    }}>
      <div style={{
        width:22, height:22, borderRadius:4, flexShrink:0,
        border:`2px solid ${checked ? color : '#243550'}`,
        background: checked ? color : 'transparent',
        display:'flex', alignItems:'center', justifyContent:'center',
        transition:'all 0.15s',
      }}>
        {checked && <span style={{color:'#050D14', fontSize:'12px', fontWeight:900, lineHeight:1}}>✓</span>}
      </div>
      <div style={{
        flex:1, fontSize:'0.87rem', fontWeight:600,
        color: checked ? '#3A556A' : '#D4E4F0',
        textDecoration: checked ? 'line-through' : 'none',
        fontFamily:"'Courier New', monospace",
        transition:'color 0.15s',
      }}>
        {chore.name}
      </div>
      <div style={{textAlign:'right', flexShrink:0}}>
        {escalLabel && (
          <div style={{fontSize:'0.65rem', color:escalColor, fontWeight:800, lineHeight:1.1}}>
            {escalLabel}
          </div>
        )}
        <div style={{fontSize:'0.75rem', fontFamily:'monospace',
          color: chore.escalLevel>0 ? escalColor : '#3A556A'}}>
          {chore.currentMinutes}m
        </div>
      </div>
    </div>
  );
}

// ─── PLAYER CARD VIEW ────────────────────────────────────────────────────────
function PlayerCardView({ player, logs, onBack, onSubmitCard, syncStatus }) {
  const totalPts = getTotalPts(player.id, logs);
  const level    = getLevel(totalPts);
  const streak   = getStreak(player.id, logs);
  const [card, setCard]         = useState(() => generateCard(player.id, logs));
  const [submitting, setSubmit] = useState(false);

  const totalMin   = card.chores.reduce((s,c)=>s+c.currentMinutes,0);
  const allChecked = card.checked.every(Boolean);
  const doneCount  = card.checked.filter(Boolean).length;
  const pending    = logs.filter(l=>l.playerId===player.id&&l.status==='pending').length;

  const toggle = i => {
    if (card.submitted) return;
    const next = { ...card, checked: card.checked.map((v,idx)=>idx===i?!v:v) };
    setCard(next); saveCard(player.id, next);
  };

  const submit = async () => {
    if (!allChecked || submitting || card.submitted) return;
    setSubmit(true);
    try {
      await onSubmitCard(card.chores);
      const next = { ...card, submitted:true };
      setCard(next); saveCard(player.id, next);
    } finally { setSubmit(false); }
  };

  const { color, glow } = player;
  const syncDot = syncStatus==='syncing' ? '#EAB308' : syncStatus==='offline' ? '#EF4444' : '#22C55E';

  return (
    <div className="fade-in" style={{display:'flex', flexDirection:'column', height:'100%', background:'#050D14'}}>
      {/* top bar */}
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'14px 20px', borderBottom:'1px solid #0D1E30', flexShrink:0,
      }}>
        <button onClick={onBack} style={{
          background:'none', border:'none', color:'#3A556A',
          fontSize:'0.75rem', cursor:'pointer', fontFamily:'monospace', letterSpacing:'1px',
        }}>← back</button>
        <div style={{display:'flex', alignItems:'center', gap:'6px'}}>
          <div style={{width:6, height:6, borderRadius:'50%', background:syncDot}}/>
          <span style={{fontSize:'0.65rem', color:'#3A556A', fontFamily:'monospace', letterSpacing:'2px'}}>
            {syncStatus==='syncing'?'sync':'live'}
          </span>
        </div>
      </div>

      {/* body */}
      <div className="scroll" style={{flex:1, padding:'28px 20px 0'}}>

        {/* avatar block */}
        <div style={{display:'flex', flexDirection:'column', alignItems:'center', marginBottom:'28px'}}>
          <CyberpunkAvatar player={player} levelNum={level.num}/>
          <div className="flicker" style={{
            fontSize:'1.25rem', fontWeight:900, letterSpacing:'4px',
            color, marginTop:'14px', textTransform:'uppercase',
            fontFamily:"'Courier New', monospace",
          }}>{player.name}</div>
          <div style={{
            fontSize:'0.6rem', letterSpacing:'5px', color, opacity:0.55,
            fontFamily:'monospace', marginTop:'3px',
          }}>{level.rank}</div>

          {/* stat pills */}
          <div style={{display:'flex', gap:'20px', marginTop:'18px'}}>
            {[
              {label:'pts',    val:totalPts.toLocaleString()},
              {label:'streak', val:streak},
              {label:'level',  val:level.num},
            ].map(({label,val},i,arr) => (
              <React.Fragment key={label}>
                <div style={{textAlign:'center'}}>
                  <div style={{color, fontWeight:700, fontSize:'1.05rem', fontFamily:'monospace'}}>{val}</div>
                  <div style={{color:'#3A556A', fontSize:'0.62rem', letterSpacing:'2px', fontFamily:'monospace'}}>{label}</div>
                </div>
                {i < arr.length-1 && <div style={{width:'1px', background:'#0D1E30'}}/>}
              </React.Fragment>
            ))}
          </div>
        </div>

        {/* divider */}
        <div style={{height:'1px', background:'#0D1E30', marginBottom:'20px'}}/>

        {/* card header */}
        <div style={{
          display:'flex', justifyContent:'space-between', alignItems:'baseline',
          marginBottom:'12px',
        }}>
          <div style={{fontSize:'0.65rem', letterSpacing:'4px', color:'#3A556A', fontFamily:'monospace'}}>
            TODAY'S CARD
          </div>
          <div style={{fontSize:'0.65rem', color:'#3A556A', fontFamily:'monospace'}}>
            {doneCount}/{card.chores.length} · est {totalMin}m
          </div>
        </div>

        {/* chores */}
        {card.chores.map((chore,i) => (
          <ChoreRow key={chore.id} chore={chore}
            checked={card.checked[i]} color={color} glow={glow}
            onToggle={()=>toggle(i)}/>
        ))}

        {/* escalation legend (shown if any chore is escalated) */}
        {card.chores.some(c=>c.escalLevel>0) && (
          <div style={{
            fontSize:'0.62rem', color:'#3A556A', fontFamily:'monospace',
            letterSpacing:'1px', marginTop:'4px', marginBottom:'8px',
          }}>
            ↑ = neglected · ↑↑ = long overdue
          </div>
        )}

        {/* pending notice */}
        {pending>0 && !card.submitted && (
          <div style={{
            marginTop:'6px', padding:'10px 14px', borderRadius:'6px',
            background:'rgba(234,179,8,0.07)', border:'1px solid rgba(234,179,8,0.25)',
            fontSize:'0.72rem', color:'#EAB308', fontFamily:'monospace', letterSpacing:'1px',
          }}>
            {pending} chore{pending>1?'s':''} pending dad's approval
          </div>
        )}

        {/* submit */}
        <div style={{marginTop:'20px', paddingBottom:'40px'}}>
          {card.submitted ? (
            <div style={{
              padding:'16px', textAlign:'center', borderRadius:'8px',
              background:`rgba(${color==='#22D3EE'?'34,211,238':'168,85,247'},0.07)`,
              border:`1px solid ${color}`,
              fontSize:'0.72rem', color, fontFamily:'monospace', letterSpacing:'3px',
            }}>
              CARD SUBMITTED — AWAITING APPROVAL
            </div>
          ) : (
            <button onClick={submit} disabled={!allChecked||submitting} style={{
              width:'100%', padding:'17px', borderRadius:'8px', cursor:allChecked?'pointer':'default',
              background: allChecked ? color : '#090F1C',
              border:`1px solid ${allChecked ? color : '#162035'}`,
              color: allChecked ? '#050D14' : '#3A556A',
              fontSize:'0.75rem', fontWeight:800, letterSpacing:'3px',
              fontFamily:'monospace', transition:'all 0.2s',
              boxShadow: allChecked ? `0 0 28px ${glow}` : 'none',
            }}>
              {submitting ? 'SUBMITTING...' : allChecked ? '⚡ SUBMIT CARD' : `CHECK OFF ALL ${card.chores.length} CHORES`}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── PLAYER SELECT ───────────────────────────────────────────────────────────
function PlayerSelect({ onSelect, onAdmin }) {
  const [taps, setTaps]   = useState(0);
  const tapTimer          = useRef(null);

  const handleTitle = () => {
    const n = taps+1; setTaps(n);
    clearTimeout(tapTimer.current);
    if (n>=5) { onAdmin(); setTaps(0); return; }
    tapTimer.current = setTimeout(()=>setTaps(0), 2000);
  };

  return (
    <div className="fade-in" style={{
      display:'flex', flexDirection:'column', alignItems:'center',
      justifyContent:'center', height:'100%', padding:'40px 28px',
      background:'#050D14',
    }}>
      <div onClick={handleTitle} style={{marginBottom:'56px', cursor:'default', userSelect:'none', textAlign:'center'}}>
        <div style={{
          fontSize:'1.5rem', fontWeight:900, letterSpacing:'7px',
          background:'linear-gradient(135deg, #22D3EE 0%, #A855F7 100%)',
          WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent',
          fontFamily:"'Courier New', monospace",
        }}>GYATTCHORES</div>
        <div style={{fontSize:'0.58rem', letterSpacing:'5px', color:'#1A2F45', fontFamily:'monospace', marginTop:'6px'}}>
          SELECT PLAYER
        </div>
      </div>

      <div style={{display:'flex', flexDirection:'column', gap:'14px', width:'100%', maxWidth:'300px'}}>
        {PLAYERS.map(p => (
          <button key={p.id} onClick={()=>onSelect(p)} style={{
            padding:'22px', borderRadius:'10px', cursor:'pointer',
            background:'#090F1C',
            border:`1px solid ${p.color}28`,
            color:p.color, fontSize:'0.9rem', fontWeight:800,
            letterSpacing:'5px', fontFamily:"'Courier New', monospace",
            textTransform:'uppercase', transition:'all 0.15s',
            boxShadow:`inset 0 0 50px ${p.glow}`,
          }}
          onPointerEnter={e=>{e.currentTarget.style.borderColor=p.color; e.currentTarget.style.boxShadow=`0 0 24px ${p.glow}, inset 0 0 50px ${p.glow}`;}}
          onPointerLeave={e=>{e.currentTarget.style.borderColor=p.color+'28'; e.currentTarget.style.boxShadow=`inset 0 0 50px ${p.glow}`;}}>
            {p.name}
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── ADMIN MODAL ─────────────────────────────────────────────────────────────
function AdminModal({ logs, onClose, onUpdate }) {
  const [code, setCode]   = useState('');
  const [authed, setAuth] = useState(false);
  const [filter, setFilt] = useState('pending');

  const verify = () => { if (code===ADMIN_CODE) setAuth(true); };
  const shown  = logs.filter(l=>filter==='all'||l.status===filter).slice(0,60);

  if (!authed) return (
    <div style={{position:'fixed',inset:0,background:'rgba(5,13,20,0.96)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:'24px'}}>
      <div style={{background:'#090F1C',border:'1px solid #162035',borderRadius:'12px',padding:'32px',width:'100%',maxWidth:'300px',textAlign:'center'}}>
        <div style={{fontSize:'0.65rem',letterSpacing:'5px',color:'#3A556A',fontFamily:'monospace',marginBottom:'24px'}}>ADMIN ACCESS</div>
        <input type="password" value={code} onChange={e=>setCode(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&verify()} placeholder="——" autoFocus
          style={{width:'100%',padding:'14px',background:'#050D14',border:'1px solid #162035',borderRadius:'6px',color:'#F8FAFC',fontSize:'1.4rem',textAlign:'center',fontFamily:'monospace',outline:'none',letterSpacing:'8px',marginBottom:'16px'}}/>
        <button onClick={verify} style={{width:'100%',padding:'13px',background:'#22D3EE',border:'none',borderRadius:'6px',color:'#050D14',fontWeight:800,fontSize:'0.75rem',letterSpacing:'3px',fontFamily:'monospace',cursor:'pointer'}}>ENTER</button>
        <button onClick={onClose} style={{width:'100%',padding:'13px',background:'none',border:'none',color:'#3A556A',fontSize:'0.72rem',cursor:'pointer',fontFamily:'monospace',marginTop:'6px'}}>cancel</button>
      </div>
    </div>
  );

  return (
    <div style={{position:'fixed',inset:0,background:'#050D14',display:'flex',flexDirection:'column',zIndex:200}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 20px',borderBottom:'1px solid #0D1E30',flexShrink:0}}>
        <div style={{fontSize:'0.65rem',letterSpacing:'4px',color:'#22D3EE',fontFamily:'monospace'}}>ADMIN // PUSH</div>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#3A556A',fontSize:'0.78rem',cursor:'pointer',fontFamily:'monospace'}}>✕ close</button>
      </div>

      <div style={{display:'flex',gap:'8px',padding:'12px 20px',borderBottom:'1px solid #0D1E30',flexShrink:0,flexWrap:'wrap'}}>
        {['pending','approved','rejected','all'].map(f=>(
          <button key={f} onClick={()=>setFilt(f)} style={{
            padding:'6px 14px',borderRadius:'20px',cursor:'pointer',
            background:filter===f?'#22D3EE':'#090F1C',
            border:`1px solid ${filter===f?'#22D3EE':'#162035'}`,
            color:filter===f?'#050D14':'#3A556A',
            fontSize:'0.68rem',fontWeight:700,letterSpacing:'1px',fontFamily:'monospace',
          }}>{f}</button>
        ))}
      </div>

      <div className="scroll" style={{flex:1,padding:'16px 20px'}}>
        {shown.length===0 && (
          <div style={{textAlign:'center',color:'#3A556A',fontFamily:'monospace',fontSize:'0.78rem',marginTop:'48px',letterSpacing:'2px'}}>
            NO {filter.toUpperCase()} LOGS
          </div>
        )}
        {shown.map(log=>{
          const p = PLAYERS.find(x=>x.id===log.playerId);
          const color = p?.color||'#22D3EE';
          return (
            <div key={log.id} style={{background:'#090F1C',border:'1px solid #162035',borderRadius:'8px',padding:'14px 16px',marginBottom:'10px'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}}>
                <div>
                  <div style={{fontSize:'0.87rem',fontWeight:600,color:'#D4E4F0',fontFamily:'monospace'}}>{log.choreName}</div>
                  <div style={{fontSize:'0.68rem',color:'#3A556A',fontFamily:'monospace',marginTop:'3px'}}>
                    <span style={{color}}>{log.playerName}</span> · {new Date(log.timestamp).toLocaleString()}
                  </div>
                </div>
                <div style={{fontSize:'0.75rem',fontWeight:700,color:'#22D3EE',fontFamily:'monospace',flexShrink:0,marginLeft:'12px'}}>
                  {log.points}pts
                </div>
              </div>
              {log.status==='pending' ? (
                <div style={{display:'flex',gap:'8px'}}>
                  <button onClick={()=>onUpdate(log.id,'approved')} style={{flex:1,padding:'9px',background:'rgba(34,197,94,0.1)',border:'1px solid #22C55E',borderRadius:'6px',color:'#22C55E',fontSize:'0.7rem',fontWeight:700,cursor:'pointer',fontFamily:'monospace',letterSpacing:'1px'}}>✓ APPROVE</button>
                  <button onClick={()=>onUpdate(log.id,'rejected')} style={{flex:1,padding:'9px',background:'rgba(239,68,68,0.1)',border:'1px solid #EF4444',borderRadius:'6px',color:'#EF4444',fontSize:'0.7rem',fontWeight:700,cursor:'pointer',fontFamily:'monospace',letterSpacing:'1px'}}>✕ REJECT</button>
                </div>
              ) : (
                <div style={{fontSize:'0.68rem',color:log.status==='approved'?'#22C55E':'#EF4444',fontFamily:'monospace',letterSpacing:'1px'}}>{log.status.toUpperCase()}</div>
              )}
            </div>
          );
        })}
        <div style={{height:'40px'}}/>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [player,   setPlayer]   = useState(null);
  const [showAdmin,setAdmin]    = useState(false);
  const [logs,     setLogs]     = useState(loadLogs);
  const [syncStatus,setSyncSt]  = useState(supabase?'idle':'offline');

  // ── sync engine ─────────────────────────────────────────────────────────────
  const sync = useCallback(async () => {
    if (!supabase) { setSyncSt('offline'); return; }
    setSyncSt('syncing');
    let work = loadLogs();
    try {
      for (const l of work.filter(x=>x.remoteId==null)) {
        const {data,error} = await supabase.from('simple_logs').insert(toRow(l)).select().single();
        if (error) throw error;
        l.remoteId=data.id; l.synced=true; l.statusDirty=false;
        if (data.created_at) l.timestamp=data.created_at;
      }
      for (const l of work.filter(x=>x.remoteId!=null&&x.statusDirty)) {
        const {error} = await supabase.from('simple_logs').update({status:l.status}).eq('id',l.remoteId);
        if (error) throw error; l.statusDirty=false;
      }
      const {data:rows,error:selErr} = await supabase.from('simple_logs').select('*').order('created_at',{ascending:false});
      if (selErr) throw selErr;
      const byRemote={};
      work.forEach(l=>{if(l.remoteId!=null) byRemote[String(l.remoteId)]=l;});
      (rows||[]).forEach(r=>{
        const ex=byRemote[String(r.id)];
        if(ex){if(!ex.statusDirty) ex.status=r.status;} else work.push(rowToLocal(r));
      });
      const latest=loadLogs(), workById={};
      work.forEach(l=>{workById[l.id]=l;});
      latest.forEach(l=>{
        if(!workById[l.id]) work.push(l);
        else if(l.statusDirty){workById[l.id].status=l.status; workById[l.id].statusDirty=true;}
      });
      work.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
      saveLogs(work); setLogs(work.slice()); setSyncSt('synced');
    } catch(e) {
      console.warn('sync deferred:', e?.message||e); setSyncSt('offline');
    }
  }, []);

  useEffect(()=>{sync();},[sync]);
  useEffect(()=>{
    const t=setInterval(sync,5000);
    const onVis=()=>{if(!document.hidden) sync();};
    const onOnl=()=>sync();
    const onSto=e=>{if(e.key===STORAGE_KEY) setLogs(loadLogs());};
    document.addEventListener('visibilitychange',onVis);
    window.addEventListener('online',onOnl);
    window.addEventListener('storage',onSto);
    return ()=>{clearInterval(t); document.removeEventListener('visibilitychange',onVis); window.removeEventListener('online',onOnl); window.removeEventListener('storage',onSto);};
  },[sync]);

  // ── submit full card (batch) ─────────────────────────────────────────────────
  const submitCard = useCallback(async (chores) => {
    const now = Date.now();
    const newLogs = chores.map((c,i) => ({
      id:makeId(), remoteId:null, synced:false, statusDirty:false,
      playerId:player.id, playerName:player.name,
      choreId:c.id, choreName:c.name, choreIcon:'',
      points:c.pts, timestamp:new Date(now+i).toISOString(), status:'pending',
    }));
    const next = [...newLogs, ...loadLogs()].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    saveLogs(next); setLogs(next); sync();
  }, [player, sync]);

  // ── admin approve/reject ──────────────────────────────────────────────────────
  const updateLog = useCallback((localId, status) => {
    const work = loadLogs().map(l=>l.id===localId?{...l,status,statusDirty:true}:l);
    saveLogs(work); setLogs(work.slice()); sync();
  }, [sync]);

  return (
    <div style={{height:'100%'}}>
      {showAdmin && <AdminModal logs={logs} onClose={()=>setAdmin(false)} onUpdate={updateLog}/>}
      {!showAdmin && !player && <PlayerSelect onSelect={setPlayer} onAdmin={()=>setAdmin(true)}/>}
      {!showAdmin && player && (
        <PlayerCardView
          player={player} logs={logs}
          onBack={()=>{setPlayer(null); sync();}}
          onSubmitCard={submitCard}
          syncStatus={syncStatus}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
