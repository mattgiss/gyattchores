<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0A0A0F">
    <title>GyattChores</title>
    <link rel="icon" type="image/svg+xml" href="gyattchores-logo-transparent.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0A0A0F;
            --surface: #16161D;
            --surface-elevated: #1E1E28;
            --text: #F8FAFC;
            --text-secondary: #94A3B8;
            --cyan: #22D3EE;
            --cyan-glow: rgba(34, 211, 238, 0.15);
            --green: #22C55E;
            --red: #EF4444;
            --purple: #A855F7;
            --radius: 16px;
            --radius-lg: 24px;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #root {
            height: 100%;
        }

        /* Safe area for notch */
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }

        /* Animations */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .animate-pop {
            animation: pop 0.3s ease-out;
        }

        .animate-fade {
            animation: fadeIn 0.2s ease-out;
        }

        /* Hide scrollbar but allow scroll */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // ============================================
        // DATA
        // ============================================

        const PLAYERS = [
            { id: '1', name: 'BeKindHearted', avatar: '🦁' },
            { id: '2', name: 'MegoDinoLava', avatar: '🦖' }
        ];

        const CHORES = [
            { id: '1', name: 'Pick up Poop', points: 500, icon: '💩' },
            { id: '2', name: 'Vacuum', points: 500, icon: '🧹' },
            { id: '3', name: 'Get Mail', points: 250, icon: '📬' },
            { id: '4', name: 'Trash', points: 375, icon: '🗑️' },
            { id: '5', name: 'Dishes', points: 500, icon: '🍽️' },
            { id: '6', name: 'Load Dishwasher', points: 625, icon: '🫧' },
            { id: '7', name: 'Unload Dishwasher', points: 500, icon: '✨' },
            { id: '8', name: 'Clean Room', points: 750, icon: '🛏️' },
            { id: '9', name: 'Clean Bathroom', points: 750, icon: '🚿' },
            { id: '10', name: 'Water Plants', points: 250, icon: '🌱' },
            { id: '11', name: 'Feed Alfred', points: 250, icon: '🐕' },
            { id: '12', name: 'Feed Chevy', points: 250, icon: '🐱' },
            { id: '13', name: 'Sweep', points: 375, icon: '🧹' },
            { id: '14', name: 'Wipe Counters', points: 375, icon: '🧽' },
            { id: '15', name: 'Fold Laundry', points: 500, icon: '👕' },
            { id: '16', name: 'Set Table', points: 250, icon: '🍴' },
            { id: '17', name: 'Clear Table', points: 250, icon: '🧹' }
        ];

        const ADMIN_CODE = '7874';

        // ============================================
        // STORAGE — local-first, with optional Supabase sync
        // ============================================
        // Chore logs are ALWAYS written to localStorage first, so logging is
        // instant and can never fail because a server is unreachable. When the
        // shared Supabase backend is reachable, logs sync across devices in the
        // background; when it isn't (e.g. a paused free-tier project), the app
        // keeps working offline and syncs automatically once it's back.

        const STORAGE_KEY = 'gyattchores_logs';

        const SUPABASE_URL = 'https://ukshxdoqgwoxobjdclpx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrc2h4ZG9xZ3dveG9iamRjbHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3MjI2NDEsImV4cCI6MjA4MDI5ODY0MX0.UGNrsfG6goEA0PPWG4x7gxBueA7D5Oe9uWI-iCXIar0';

        // Create the Supabase client if the library loaded. If it's blocked or
        // the page is offline, `supabase` is null and the app runs local-only.
        const supabase = (window.supabase && window.supabase.createClient)
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
            : null;

        // Read logs from localStorage, newest first.
        const loadLogs = () => {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return parsed
                    .slice()
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            } catch (e) {
                console.error('Failed to read logs:', e);
                return [];
            }
        };

        // Persist logs to localStorage.
        const saveLogs = (logs) => {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
            } catch (e) {
                console.error('Failed to save logs:', e);
            }
        };

        // Generate a unique local id for a new log entry.
        const makeId = () =>
            (window.crypto && crypto.randomUUID)
                ? crypto.randomUUID()
                : Date.now().toString(36) + Math.random().toString(36).slice(2);

        // Convert a Supabase row (snake_case) into a local log a device created
        // elsewhere. `remoteId` ties it back to the shared row; `synced` true.
        const rowToLocal = (r) => ({
            id: 'r_' + r.id,
            remoteId: r.id,
            synced: true,
            statusDirty: false,
            playerId: r.player_id,
            playerName: r.player_name,
            choreId: r.chore_id,
            choreName: r.chore_name,
            choreIcon: r.chore_icon,
            points: r.points,
            timestamp: r.created_at,
            status: r.status
        });

        // The Supabase payload for a locally-created log (no id — the DB makes it).
        const toRow = (l) => ({
            player_id: l.playerId,
            player_name: l.playerName,
            chore_id: l.choreId,
            chore_name: l.choreName,
            chore_icon: l.choreIcon,
            points: l.points,
            status: l.status
        });

        // ============================================
        // MAIN APP
        // ============================================

        function App() {
            const [selectedPlayer, setSelectedPlayer] = useState(null);
            const [logs, setLogs] = useState(loadLogs);
            const [showSuccess, setShowSuccess] = useState(null);
            const [showAdmin, setShowAdmin] = useState(false);
            // 'idle' | 'syncing' | 'synced' | 'offline' (offline = backend unreachable)
            const [syncStatus, setSyncStatus] = useState(supabase ? 'idle' : 'offline');

            // Reconcile local logs with the shared Supabase table:
            //   1. push locally-created logs that aren't on the server yet,
            //   2. push local status changes (approve/reject),
            //   3. pull the shared rows and merge them in.
            // Everything operates on a working array and writes localStorage
            // ONCE, so a chore logged mid-sync is never lost. Any failure just
            // leaves us in 'offline' — local data is untouched and we retry.
            const sync = useCallback(async () => {
                if (!supabase) { setSyncStatus('offline'); return; }
                setSyncStatus('syncing');
                let work = loadLogs();
                try {
                    // 1. Push new local logs (no remoteId yet).
                    for (const l of work.filter(x => x.remoteId == null)) {
                        const { data, error } = await supabase
                            .from('simple_logs').insert(toRow(l)).select().single();
                        if (error) throw error;
                        l.remoteId = data.id;
                        l.synced = true;
                        l.statusDirty = false;
                        if (data.created_at) l.timestamp = data.created_at;
                    }

                    // 2. Push local status changes.
                    for (const l of work.filter(x => x.remoteId != null && x.statusDirty)) {
                        const { error } = await supabase
                            .from('simple_logs').update({ status: l.status }).eq('id', l.remoteId);
                        if (error) throw error;
                        l.statusDirty = false;
                    }

                    // 3. Pull shared rows and merge.
                    const { data: rows, error: selErr } = await supabase
                        .from('simple_logs').select('*').order('created_at', { ascending: false });
                    if (selErr) throw selErr;
                    const byRemote = {};
                    work.forEach(l => { if (l.remoteId != null) byRemote[String(l.remoteId)] = l; });
                    (rows || []).forEach(r => {
                        const existing = byRemote[String(r.id)];
                        if (existing) {
                            // Server is shared truth for status, unless we have an
                            // un-pushed local change for this row.
                            if (!existing.statusDirty) existing.status = r.status;
                        } else {
                            work.push(rowToLocal(r));
                        }
                    });

                    // Re-absorb anything the user logged while we were awaiting
                    // the network, so concurrent edits are never overwritten.
                    const latest = loadLogs();
                    const workById = {};
                    work.forEach(l => { workById[l.id] = l; });
                    latest.forEach(l => {
                        if (!workById[l.id]) work.push(l);
                        else if (l.statusDirty) {
                            workById[l.id].status = l.status;
                            workById[l.id].statusDirty = true;
                        }
                    });

                    work.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    saveLogs(work);
                    setLogs(work.slice());
                    setSyncStatus('synced');
                } catch (e) {
                    console.warn('Sync deferred — backend unreachable:', e && (e.message || e));
                    setSyncStatus('offline');
                }
            }, []);

            // Initial sync + keep in sync: poll, on tab focus, on reconnect, and
            // when another tab on this device changes the shared localStorage.
            useEffect(() => {
                sync();
                const interval = setInterval(sync, 5000);
                const onVisible = () => { if (document.visibilityState === 'visible') sync(); };
                const onOnline = () => sync();
                const onStorage = (e) => { if (e.key === STORAGE_KEY) setLogs(loadLogs()); };
                document.addEventListener('visibilitychange', onVisible);
                window.addEventListener('online', onOnline);
                window.addEventListener('storage', onStorage);
                return () => {
                    clearInterval(interval);
                    document.removeEventListener('visibilitychange', onVisible);
                    window.removeEventListener('online', onOnline);
                    window.removeEventListener('storage', onStorage);
                };
            }, [sync]);

            // Calculate points
            const getWeeklyPoints = (playerId) => {
                const weekStart = new Date();
                weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
                weekStart.setHours(0, 0, 0, 0);

                return logs
                    .filter(log =>
                        log.playerId === playerId &&
                        log.status === 'approved' &&
                        new Date(log.timestamp) >= weekStart
                    )
                    .reduce((sum, log) => sum + log.points, 0);
            };

            const getTodayPoints = (playerId) => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                return logs
                    .filter(log =>
                        log.playerId === playerId &&
                        log.status === 'approved' &&
                        new Date(log.timestamp) >= today
                    )
                    .reduce((sum, log) => sum + log.points, 0);
            };

            const getLastMonthTodayPoints = (playerId) => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const start = new Date(today);
                start.setMonth(start.getMonth() - 1);
                const end = new Date(start);
                end.setDate(end.getDate() + 1);

                return logs
                    .filter(log =>
                        log.playerId === playerId &&
                        log.status === 'approved' &&
                        new Date(log.timestamp) >= start &&
                        new Date(log.timestamp) < end
                    )
                    .reduce((sum, log) => sum + log.points, 0);
            };

            const getLastMonthWeeklyPoints = (playerId) => {
                const weekStart = new Date();
                weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
                weekStart.setHours(0, 0, 0, 0);
                const start = new Date(weekStart);
                start.setMonth(start.getMonth() - 1);
                const end = new Date(start);
                end.setDate(end.getDate() + 7);

                return logs
                    .filter(log =>
                        log.playerId === playerId &&
                        log.status === 'approved' &&
                        new Date(log.timestamp) >= start &&
                        new Date(log.timestamp) < end
                    )
                    .reduce((sum, log) => sum + log.points, 0);
            };

            const getMonthlyPoints = (playerId) => {
                const monthStart = new Date();
                monthStart.setDate(1);
                monthStart.setHours(0, 0, 0, 0);

                return logs
                    .filter(log =>
                        log.playerId === playerId &&
                        log.status === 'approved' &&
                        new Date(log.timestamp) >= monthStart
                    )
                    .reduce((sum, log) => sum + log.points, 0);
            };

            // Same number of days into last month (e.g. on Jun 6, compares May 1–6)
            const getLastMonthSamePeriodPoints = (playerId) => {
                const now = new Date();
                const start = new Date(now.getFullYear(), now.getMonth() - 1, 1, 0, 0, 0, 0);
                const end = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate() + 1, 0, 0, 0, 0);

                return logs
                    .filter(log =>
                        log.playerId === playerId &&
                        log.status === 'approved' &&
                        new Date(log.timestamp) >= start &&
                        new Date(log.timestamp) < end
                    )
                    .reduce((sum, log) => sum + log.points, 0);
            };

            const getTotalPoints = (playerId) =>
                logs
                    .filter(log => log.playerId === playerId && log.status === 'approved')
                    .reduce((sum, log) => sum + log.points, 0);

            const pendingLogs = logs.filter(log => log.status === 'pending');

            const leader = PLAYERS.reduce((best, player) => {
                const pts = getWeeklyPoints(player.id);
                if (!best || pts > best.pts) return { player, pts };
                return best;
            }, null);

            // Log a chore — saved locally, instantly. Cannot fail on a network.
            // We persist synchronously (via loadLogs/saveLogs) so the follow-up
            // sync() always sees the new entry, then push it to Supabase.
            const logChore = (chore) => {
                if (!selectedPlayer) return;

                // Show success immediately for a snappy, frictionless feel.
                setShowSuccess(chore);
                if (navigator.vibrate) navigator.vibrate(10);
                setTimeout(() => setShowSuccess(null), 1500);

                const newLog = {
                    id: makeId(),
                    remoteId: null,
                    synced: false,
                    statusDirty: false,
                    playerId: selectedPlayer.id,
                    playerName: selectedPlayer.name,
                    choreId: chore.id,
                    choreName: chore.name,
                    choreIcon: chore.icon,
                    points: chore.points,
                    timestamp: new Date().toISOString(),
                    status: 'pending'
                };

                const next = [newLog, ...loadLogs()]
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                saveLogs(next);
                setLogs(next);
                sync();
            };

            // Approve/reject — update locally, mark for push, then sync.
            const setStatus = (logId, status) => {
                const next = loadLogs().map(log =>
                    log.id === logId
                        ? { ...log, status, statusDirty: log.remoteId != null }
                        : log
                );
                saveLogs(next);
                setLogs(next);
                sync();
            };

            const approve = (logId) => {
                if (navigator.vibrate) navigator.vibrate([10, 50, 10]);
                setStatus(logId, 'approved');
            };

            const reject = (logId) => {
                setStatus(logId, 'rejected');
            };

            const approveAll = () => {
                if (navigator.vibrate) navigator.vibrate([10, 50, 10]);
                const cur = loadLogs();
                if (!cur.some(log => log.status === 'pending')) return;
                const next = cur.map(log =>
                    log.status === 'pending'
                        ? { ...log, status: 'approved', statusDirty: log.remoteId != null }
                        : log
                );
                saveLogs(next);
                setLogs(next);
                sync();
            };

            return (
                <div style={{
                    height: '100%',
                    display: 'flex',
                    flexDirection: 'column',
                    background: 'var(--bg)'
                }}>
                    {/* Header */}
                    <header style={{
                        padding: '16px 20px',
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        borderBottom: '1px solid var(--surface)'
                    }}>
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '12px'
                        }}>
                            <img
                                src="gyattchores-logo-transparent.svg"
                                alt="GyattChores Logo"
                                style={{
                                    width: '32px',
                                    height: '32px'
                                }}
                            />
                            <h1 style={{
                                fontSize: '1.5rem',
                                fontWeight: 700,
                                background: 'linear-gradient(135deg, var(--cyan), var(--purple))',
                                WebkitBackgroundClip: 'text',
                                WebkitTextFillColor: 'transparent'
                            }}>
                                GyattChores
                            </h1>
                        </div>
                        <button
                            onClick={() => setShowAdmin(true)}
                            style={{
                                background: 'var(--surface)',
                                border: 'none',
                                borderRadius: '12px',
                                padding: '10px 14px',
                                color: 'var(--text)',
                                fontSize: '1rem',
                                cursor: 'pointer',
                                display: 'flex',
                                alignItems: 'center',
                                gap: '8px',
                                position: 'relative'
                            }}
                        >
                            <span>✓</span>
                            {pendingLogs.length > 0 && (
                                <span style={{
                                    position: 'absolute',
                                    top: '-6px',
                                    right: '-6px',
                                    background: 'var(--red)',
                                    color: 'white',
                                    fontSize: '0.7rem',
                                    fontWeight: 700,
                                    padding: '2px 6px',
                                    borderRadius: '10px',
                                    minWidth: '18px',
                                    textAlign: 'center'
                                }}>
                                    {pendingLogs.length}
                                </span>
                            )}
                        </button>
                    </header>

                    {/* Offline hint — non-blocking. Logging still works; data
                        is saved on this device and syncs when the backend is back. */}
                    {syncStatus === 'offline' && (
                        <div style={{
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: '8px',
                            padding: '6px 16px',
                            background: 'rgba(245, 158, 11, 0.12)',
                            color: '#f59e0b',
                            borderBottom: '1px solid rgba(245, 158, 11, 0.25)',
                            fontSize: '0.8rem',
                            fontWeight: 600
                        }}>
                            <span style={{
                                width: '7px',
                                height: '7px',
                                borderRadius: '50%',
                                background: 'currentColor'
                            }} />
                            Offline — saved on this device, will sync later
                        </div>
                    )}

                    {/* Main Content */}
                    <main style={{
                        flex: 1,
                        overflow: 'auto',
                        padding: '20px'
                    }}>
                        {/* Player Selection */}
                        <div style={{
                            display: 'flex',
                            gap: '12px',
                            marginBottom: '20px'
                        }}>
                            {PLAYERS.map(player => (
                                <PlayerCard
                                    key={player.id}
                                    player={player}
                                    isSelected={selectedPlayer?.id === player.id}
                                    isLeader={leader?.player.id === player.id && leader.pts > 0}
                                    points={getWeeklyPoints(player.id)}
                                    onClick={() => setSelectedPlayer(player)}
                                />
                            ))}
                        </div>

                        {/* Stats */}
                        {selectedPlayer && (() => {
                            const todayPts = getTodayPoints(selectedPlayer.id);
                            const lastMonthTodayPts = getLastMonthTodayPoints(selectedPlayer.id);
                            const weekPts = getWeeklyPoints(selectedPlayer.id);
                            const lastMonthWeekPts = getLastMonthWeeklyPoints(selectedPlayer.id);
                            const monthPts = getMonthlyPoints(selectedPlayer.id);
                            const lastMonthSamePts = getLastMonthSamePeriodPoints(selectedPlayer.id);
                            const totalPts = getTotalPoints(selectedPlayer.id);
                            return (
                                <div style={{
                                    display: 'grid',
                                    gridTemplateColumns: 'repeat(2, 1fr)',
                                    gap: '12px',
                                    marginBottom: '24px'
                                }} className="animate-fade">
                                    <StatPill
                                        label="Today"
                                        value={todayPts}
                                        color="orange"
                                        trend={(todayPts > 0 || lastMonthTodayPts > 0)
                                            ? { delta: todayPts - lastMonthTodayPts }
                                            : null}
                                    />
                                    <StatPill
                                        label="This Week"
                                        value={weekPts}
                                        color="cyan"
                                        trend={(weekPts > 0 || lastMonthWeekPts > 0)
                                            ? { delta: weekPts - lastMonthWeekPts }
                                            : null}
                                    />
                                    <StatPill
                                        label="This Month"
                                        value={monthPts}
                                        color="purple"
                                        trend={(monthPts > 0 || lastMonthSamePts > 0)
                                            ? { delta: monthPts - lastMonthSamePts }
                                            : null}
                                    />
                                    <StatPill
                                        label="Total Earned"
                                        value={totalPts}
                                        color="gold"
                                    />
                                </div>
                            );
                        })()}

                        {/* Chores Grid */}
                        <div style={{
                            display: 'grid',
                            gridTemplateColumns: 'repeat(2, 1fr)',
                            gap: '12px'
                        }}>
                            {CHORES.map(chore => (
                                <ChoreCard
                                    key={chore.id}
                                    chore={chore}
                                    disabled={!selectedPlayer}
                                    onClick={() => logChore(chore)}
                                />
                            ))}
                        </div>
                    </main>

                    {/* Success Overlay */}
                    {showSuccess && (
                        <div style={{
                            position: 'fixed',
                            inset: 0,
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            background: 'rgba(0,0,0,0.6)',
                            backdropFilter: 'blur(8px)',
                            zIndex: 100
                        }} className="animate-pop">
                            <div style={{
                                background: 'var(--surface)',
                                borderRadius: 'var(--radius-lg)',
                                padding: '40px',
                                textAlign: 'center'
                            }}>
                                <div style={{ fontSize: '4rem', marginBottom: '16px' }}>
                                    {showSuccess.icon}
                                </div>
                                <div style={{ fontSize: '1.5rem', fontWeight: 700, marginBottom: '8px' }}>
                                    Logged!
                                </div>
                                <div style={{ color: 'var(--cyan)', fontWeight: 600 }}>
                                    +{showSuccess.points} pts
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Admin Modal */}
                    {showAdmin && (
                        <AdminModal
                            logs={pendingLogs}
                            allLogs={logs}
                            onApprove={approve}
                            onReject={reject}
                            onApproveAll={approveAll}
                            onClose={() => setShowAdmin(false)}
                        />
                    )}
                </div>
            );
        }

        // ============================================
        // COMPONENTS
        // ============================================

        function PlayerCard({ player, isSelected, isLeader, points, onClick }) {
            return (
                <button
                    onClick={onClick}
                    style={{
                        flex: 1,
                        background: isSelected ? 'var(--cyan-glow)' : 'var(--surface)',
                        border: isSelected ? '2px solid var(--cyan)' : '2px solid transparent',
                        borderRadius: 'var(--radius-lg)',
                        padding: '20px 16px',
                        cursor: 'pointer',
                        textAlign: 'center',
                        transition: 'all 0.2s ease',
                        transform: isSelected ? 'scale(1.02)' : 'scale(1)'
                    }}
                >
                    <div style={{ position: 'relative', display: 'inline-block' }}>
                        <span style={{ fontSize: '3rem' }}>{player.avatar}</span>
                        {isLeader && (
                            <span style={{
                                position: 'absolute',
                                top: '-8px',
                                right: '-12px',
                                fontSize: '1.2rem'
                            }}>👑</span>
                        )}
                    </div>
                    <div style={{
                        color: 'var(--text)',
                        fontWeight: 600,
                        marginTop: '8px',
                        fontSize: '0.9rem'
                    }}>
                        {player.name}
                    </div>
                    <div style={{
                        color: 'var(--text-secondary)',
                        fontSize: '0.8rem',
                        marginTop: '4px'
                    }}>
                        {points} pts
                    </div>
                </button>
            );
        }

        function StatPill({ label, value, color, trend }) {
            const colors = {
                orange: '#F59E0B',
                cyan: 'var(--cyan)',
                purple: 'var(--purple)',
                gold: '#EAB308'
            };

            const trendArrow = !trend ? null : trend.delta > 0 ? '↑' : trend.delta < 0 ? '↓' : '→';
            const trendColor = !trend ? null : trend.delta > 0 ? '#22c55e' : trend.delta < 0 ? '#ef4444' : 'var(--text-secondary)';
            const trendLabel = !trend ? null : trend.delta > 0 ? `+${trend.delta}` : `${trend.delta}`;

            return (
                <div style={{
                    background: 'var(--surface)',
                    borderRadius: '100px',
                    padding: '10px 16px',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '10px'
                }}>
                    <span style={{
                        width: '8px',
                        height: '8px',
                        borderRadius: '50%',
                        background: colors[color]
                    }} />
                    <div>
                        <div style={{ fontWeight: 700, fontSize: '1rem' }}>{value}</div>
                        <div style={{ color: 'var(--text-secondary)', fontSize: '0.75rem' }}>{label}</div>
                    </div>
                    {trend && (
                        <div style={{
                            display: 'flex',
                            flexDirection: 'column',
                            alignItems: 'center',
                            color: trendColor,
                            lineHeight: 1.1
                        }}>
                            <span style={{ fontSize: '0.85rem', fontWeight: 700 }}>{trendArrow}</span>
                            <span style={{ fontSize: '0.65rem', fontWeight: 600 }}>{trendLabel}</span>
                        </div>
                    )}
                </div>
            );
        }

        function ChoreCard({ chore, disabled, onClick }) {
            const [isPressed, setIsPressed] = useState(false);

            return (
                <button
                    onClick={onClick}
                    disabled={disabled}
                    onTouchStart={() => setIsPressed(true)}
                    onTouchEnd={() => setIsPressed(false)}
                    onMouseDown={() => setIsPressed(true)}
                    onMouseUp={() => setIsPressed(false)}
                    onMouseLeave={() => setIsPressed(false)}
                    style={{
                        background: 'var(--surface)',
                        border: 'none',
                        borderRadius: 'var(--radius)',
                        padding: '20px 12px',
                        cursor: disabled ? 'not-allowed' : 'pointer',
                        textAlign: 'center',
                        opacity: disabled ? 0.4 : 1,
                        transition: 'transform 0.1s ease',
                        transform: isPressed ? 'scale(0.95)' : 'scale(1)'
                    }}
                >
                    <div style={{ fontSize: '2.2rem', marginBottom: '8px' }}>
                        {chore.icon}
                    </div>
                    <div style={{
                        color: 'var(--text)',
                        fontWeight: 500,
                        fontSize: '0.85rem',
                        marginBottom: '4px',
                        lineHeight: 1.3
                    }}>
                        {chore.name}
                    </div>
                    <div style={{
                        color: 'var(--cyan)',
                        fontWeight: 700,
                        fontSize: '0.8rem'
                    }}>
                        {chore.points} pts
                    </div>
                </button>
            );
        }

        function AdminModal({ logs, allLogs, onApprove, onReject, onApproveAll, onClose }) {
            const [code, setCode] = useState('');
            const [unlocked, setUnlocked] = useState(false);
            const [error, setError] = useState(false);
            const [tab, setTab] = useState('pending'); // 'pending' | 'history'

            const checkCode = (value) => {
                setCode(value);
                if (value.length === 4) {
                    if (value === ADMIN_CODE) {
                        setUnlocked(true);
                        if (navigator.vibrate) navigator.vibrate(10);
                    } else {
                        setError(true);
                        setCode('');
                        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                        setTimeout(() => setError(false), 1500);
                    }
                }
            };

            return (
                <div style={{
                    position: 'fixed',
                    inset: 0,
                    background: 'var(--bg)',
                    zIndex: 200,
                    display: 'flex',
                    flexDirection: 'column'
                }}>
                    {/* Header */}
                    <header style={{
                        padding: '16px 20px',
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        borderBottom: '1px solid var(--surface)'
                    }}>
                        <button
                            onClick={onClose}
                            style={{
                                background: 'none',
                                border: 'none',
                                color: 'var(--cyan)',
                                fontSize: '1rem',
                                fontWeight: 600,
                                cursor: 'pointer'
                            }}
                        >
                            Done
                        </button>
                        <h2 style={{ fontSize: '1.1rem', fontWeight: 600 }}>
                            {!unlocked ? 'Admin' : tab === 'pending' ? 'Pending Approval' : 'History'}
                        </h2>
                        {unlocked && tab === 'pending' && logs.length > 0 ? (
                            <button
                                onClick={onApproveAll}
                                style={{
                                    background: 'none',
                                    border: 'none',
                                    color: 'var(--green)',
                                    fontSize: '0.9rem',
                                    fontWeight: 600,
                                    cursor: 'pointer'
                                }}
                            >
                                Approve All
                            </button>
                        ) : (
                            <div style={{ width: '80px' }} />
                        )}
                    </header>

                    {/* Tab Bar (only when unlocked) */}
                    {unlocked && (
                        <div style={{
                            display: 'flex',
                            borderBottom: '1px solid var(--surface)',
                            padding: '0 20px'
                        }}>
                            {['pending', 'history'].map(t => (
                                <button
                                    key={t}
                                    onClick={() => setTab(t)}
                                    style={{
                                        background: 'none',
                                        border: 'none',
                                        borderBottom: tab === t ? '2px solid var(--cyan)' : '2px solid transparent',
                                        color: tab === t ? 'var(--cyan)' : 'var(--text-secondary)',
                                        fontWeight: 600,
                                        fontSize: '0.9rem',
                                        padding: '12px 16px',
                                        cursor: 'pointer',
                                        marginBottom: '-1px',
                                        textTransform: 'capitalize'
                                    }}
                                >
                                    {t === 'pending' ? `Pending${logs.length > 0 ? ` (${logs.length})` : ''}` : 'History'}
                                </button>
                            ))}
                        </div>
                    )}

                    {/* Content */}
                    <div style={{ flex: 1, overflow: 'auto', padding: '20px' }}>
                        {unlocked && tab === 'history' ? (
                            /* History & Stats Tab */
                            (() => {
                                const approved = allLogs.filter(l => l.status === 'approved');
                                const rejected = allLogs.filter(l => l.status === 'rejected');
                                const pending  = allLogs.filter(l => l.status === 'pending');
                                const sorted   = [...allLogs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                                const totalPts = approved.reduce((s, l) => s + l.points, 0);
                                const oldest   = allLogs.length ? new Date(Math.min(...allLogs.map(l => new Date(l.timestamp)))) : null;
                                const stale    = pending.filter(l => Date.now() - new Date(l.timestamp) > 86400000);

                                const fmtDate = (d) => new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                                const fmtTime = (d) => new Date(d).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });

                                const statusColor = { approved: 'var(--green)', rejected: 'var(--red)', pending: '#F59E0B' };
                                const statusLabel = { approved: '✓', rejected: '✕', pending: '…' };

                                return (
                                    <div>
                                        {/* Summary stats */}
                                        <div style={{
                                            display: 'grid',
                                            gridTemplateColumns: 'repeat(2, 1fr)',
                                            gap: '10px',
                                            marginBottom: '20px'
                                        }}>
                                            {[
                                                { label: 'Total Earned', value: `${totalPts} pts`, color: '#EAB308' },
                                                { label: 'Chores Done', value: approved.length, color: 'var(--green)' },
                                                { label: 'Pending', value: pending.length, color: '#F59E0B' },
                                                { label: 'Rejected', value: rejected.length, color: 'var(--red)' }
                                            ].map(s => (
                                                <div key={s.label} style={{
                                                    background: 'var(--surface)',
                                                    borderRadius: '12px',
                                                    padding: '14px',
                                                    textAlign: 'center'
                                                }}>
                                                    <div style={{ fontWeight: 700, fontSize: '1.3rem', color: s.color }}>{s.value}</div>
                                                    <div style={{ color: 'var(--text-secondary)', fontSize: '0.75rem', marginTop: '2px' }}>{s.label}</div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Data health flags */}
                                        {stale.length > 0 && (
                                            <div style={{
                                                background: 'rgba(245, 158, 11, 0.12)',
                                                border: '1px solid rgba(245, 158, 11, 0.3)',
                                                borderRadius: '12px',
                                                padding: '12px 16px',
                                                marginBottom: '16px',
                                                fontSize: '0.85rem',
                                                color: '#F59E0B'
                                            }}>
                                                ⚠️ {stale.length} pending {stale.length === 1 ? 'chore is' : 'chores are'} over 24h old — review or reject in the Pending tab.
                                            </div>
                                        )}

                                        {oldest && (
                                            <div style={{
                                                color: 'var(--text-secondary)',
                                                fontSize: '0.78rem',
                                                marginBottom: '16px',
                                                textAlign: 'center'
                                            }}>
                                                Data since {fmtDate(oldest)} · {allLogs.length} total records on this device
                                            </div>
                                        )}

                                        {/* Log list */}
                                        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                                            {sorted.map(log => (
                                                <div key={log.id} style={{
                                                    background: 'var(--surface)',
                                                    borderRadius: '12px',
                                                    padding: '12px 14px',
                                                    display: 'flex',
                                                    alignItems: 'center',
                                                    gap: '12px',
                                                    opacity: log.status === 'rejected' ? 0.5 : 1
                                                }}>
                                                    <span style={{ fontSize: '1.5rem', flexShrink: 0 }}>{log.choreIcon}</span>
                                                    <div style={{ flex: 1, minWidth: 0 }}>
                                                        <div style={{ fontWeight: 600, fontSize: '0.9rem', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>
                                                            {log.choreName}
                                                        </div>
                                                        <div style={{ color: 'var(--text-secondary)', fontSize: '0.75rem', marginTop: '1px' }}>
                                                            {log.playerName} · {fmtDate(log.timestamp)} {fmtTime(log.timestamp)}
                                                        </div>
                                                    </div>
                                                    <div style={{ color: 'var(--cyan)', fontWeight: 700, fontSize: '0.85rem', flexShrink: 0 }}>
                                                        {log.status === 'approved' ? '+' : ''}{log.points}
                                                    </div>
                                                    <div style={{
                                                        width: '24px',
                                                        height: '24px',
                                                        borderRadius: '50%',
                                                        background: `${statusColor[log.status]}22`,
                                                        color: statusColor[log.status],
                                                        display: 'flex',
                                                        alignItems: 'center',
                                                        justifyContent: 'center',
                                                        fontWeight: 700,
                                                        fontSize: '0.8rem',
                                                        flexShrink: 0
                                                    }}>
                                                        {statusLabel[log.status]}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {allLogs.length === 0 && (
                                            <div style={{ textAlign: 'center', color: 'var(--text-secondary)', marginTop: '60px' }}>
                                                No history on this device yet.
                                            </div>
                                        )}
                                    </div>
                                );
                            })()
                        ) : !unlocked ? (
                            /* Code Entry */
                            <div style={{
                                display: 'flex',
                                flexDirection: 'column',
                                alignItems: 'center',
                                justifyContent: 'center',
                                height: '100%',
                                gap: '24px'
                            }}>
                                <div style={{ fontSize: '4rem' }}>🔐</div>
                                <input
                                    type="password"
                                    inputMode="numeric"
                                    maxLength={4}
                                    value={code}
                                    onChange={(e) => checkCode(e.target.value)}
                                    placeholder="••••"
                                    autoFocus
                                    style={{
                                        background: 'var(--surface)',
                                        border: error ? '2px solid var(--red)' : '2px solid transparent',
                                        borderRadius: '12px',
                                        padding: '16px',
                                        fontSize: '2rem',
                                        fontWeight: 700,
                                        color: 'var(--text)',
                                        textAlign: 'center',
                                        width: '160px',
                                        letterSpacing: '8px',
                                        outline: 'none'
                                    }}
                                />
                                {error && (
                                    <div style={{ color: 'var(--red)', fontSize: '0.9rem' }}>
                                        Wrong code
                                    </div>
                                )}
                            </div>
                        ) : logs.length === 0 ? (
                            /* Empty State */
                            <div style={{
                                display: 'flex',
                                flexDirection: 'column',
                                alignItems: 'center',
                                justifyContent: 'center',
                                height: '100%',
                                gap: '16px',
                                color: 'var(--text-secondary)'
                            }}>
                                <div style={{ fontSize: '4rem' }}>✅</div>
                                <div style={{ fontSize: '1.2rem', fontWeight: 600 }}>All caught up!</div>
                                <div>No chores waiting for approval</div>
                            </div>
                        ) : (
                            /* Pending List */
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                                {logs.map(log => (
                                    <div
                                        key={log.id}
                                        style={{
                                            background: 'var(--surface)',
                                            borderRadius: 'var(--radius)',
                                            padding: '16px',
                                            display: 'flex',
                                            alignItems: 'center',
                                            gap: '16px'
                                        }}
                                    >
                                        <span style={{ fontSize: '2rem' }}>{log.choreIcon}</span>
                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontWeight: 600 }}>{log.choreName}</div>
                                            <div style={{
                                                color: 'var(--text-secondary)',
                                                fontSize: '0.85rem',
                                                marginTop: '2px'
                                            }}>
                                                {log.playerName}
                                            </div>
                                        </div>
                                        <div style={{
                                            color: 'var(--cyan)',
                                            fontWeight: 700,
                                            marginRight: '8px'
                                        }}>
                                            +{log.points}
                                        </div>
                                        <button
                                            onClick={() => onReject(log.id)}
                                            style={{
                                                background: 'rgba(239, 68, 68, 0.15)',
                                                border: 'none',
                                                borderRadius: '10px',
                                                padding: '10px 14px',
                                                color: 'var(--red)',
                                                fontWeight: 600,
                                                cursor: 'pointer'
                                            }}
                                        >
                                            ✕
                                        </button>
                                        <button
                                            onClick={() => onApprove(log.id)}
                                            style={{
                                                background: 'rgba(34, 197, 94, 0.15)',
                                                border: 'none',
                                                borderRadius: '10px',
                                                padding: '10px 14px',
                                                color: 'var(--green)',
                                                fontWeight: 600,
                                                cursor: 'pointer'
                                            }}
                                        >
                                            ✓
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ============================================
        // RENDER

        // ============================================

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
