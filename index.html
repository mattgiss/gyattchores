  { id:'wipe-dining-table',   name:'wipe dining table',          cat:'floors',   pts:10, tiers:[4,6,8],    tierDays:[0,1,3]  },
  { id:'dog-poop',            name:'pick up dog poop',           cat:'outdoor',  pts:15, tiers:[5,10,18],  tierDays:[0,1,3]  },
  { id:'take-out-trash',      name:'take out trash/recycling',   cat:'outdoor',  pts:10, tiers:[4,4,6],    tierDays:[0,3,7]  },
  { id:'water-plants',        name:'water plants',               cat:'outdoor',  pts:10, tiers:[4,4,8],    tierDays:[0,3,7]  },
  { id:'make-bed',            name:'make bed',                   cat:'room',     pts:8,  tiers:[3,3,5],    tierDays:[0,2,4]  },
  { id:'pick-up-room',        name:'pick up room floor',         cat:'room',     pts:12, tiers:[5,8,15],   tierDays:[0,2,4]  },

];

// ─── STORAGE ─────────────────────────────────────────────────────────────────
const makeId     = () => `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
const loadLogs   = () => {
  try {
    return (JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'))
      .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
  } catch { return []; }
};
const saveLogs   = logs => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); } catch {} };
const toRow      = l => ({ player_id:l.playerId, player_name:l.playerName, chore_id:l.choreId, chore_name:l.choreName, chore_icon:'', points:l.points, status:l.status });
const rowToLocal = r => ({ id:'r_'+r.id, remoteId:r.id, synced:true, statusDirty:false, playerId:r.player_id, playerName:r.player_name, choreId:r.chore_id, choreName:r.chore_name, choreIcon:'', points:r.points, timestamp:r.created_at, status:r.status });

// ─── CARD ENGINE ─────────────────────────────────────────────────────────────
const cardKey = id => `gyattchores_card_${id}_${new Date().toDateString()}`;

const neglectDays = (choreId, playerId, logs) => {
  const last = logs
    .filter(l => l.playerId===playerId && l.choreId===choreId && l.status==='approved')
    .sort((a,b) => new Date(b.timestamp)-new Date(a.timestamp))[0];
  return last ? Math.floor((Date.now()-new Date(last.timestamp))/86400000) : 999;
};

const enrichChore = (chore, days) => {
  let tier = 0;
  for (let i = chore.tierDays.length-1; i>=0; i--) { if (days>=chore.tierDays[i]){ tier=i; break; } }
  return { ...chore, neglectDays:days, currentMinutes:chore.tiers[tier], escalLevel:tier };
};

// How many minutes of chores a player can put on their daily card.
const DAILY_MINUTES = 25;

// The chore pool, enriched with each chore's current minutes/escalation for this
// player, ranked most-neglected first so the overdue stuff surfaces as a
// suggestion — but the player picks what actually goes on the card.
const pickableChores = (playerId, logs) =>
  CHORE_POOL
    .map(c => enrichChore(c, neglectDays(c.id, playerId, logs)))
    .sort((a,b) => (b.neglectDays - a.neglectDays) || (a.currentMinutes - b.currentMinutes));

// Top a selection up to the daily budget with chores that "make sense": same
// room/category as what's already picked first, then the most-neglected, always
// the short everyday stuff. The goal is a full ~25-minute card, not a token one.
const suggestFill = (pickedIds, pool, cap) => {
  const result = [...pickedIds];
  const cats   = new Set(pool.filter(c=>pickedIds.includes(c.id)).map(c=>c.cat));
  let total    = pool.filter(c=>pickedIds.includes(c.id)).reduce((s,c)=>s+c.currentMinutes,0);
  const candidates = pool
    .filter(c => !pickedIds.includes(c.id))
    .sort((a,b) => {
      const aff = (cats.has(b.cat)?1:0) - (cats.has(a.cat)?1:0);   // same-area first
      return aff || (b.neglectDays - a.neglectDays) || (b.currentMinutes - a.currentMinutes);
    });
  for (const c of candidates) {
    if (total + c.currentMinutes <= cap) { result.push(c.id); total += c.currentMinutes; }
  }
  return result;
};

const loadCard = playerId => {
  const cached = localStorage.getItem(cardKey(playerId));
  return cached ? JSON.parse(cached) : null;
};

// Build a fresh card from the chores the player picked.
const buildCard = (playerId, chores) => {
  const card = { date:new Date().toDateString(), chores, checked:chores.map(()=>false), submitted:false };
  localStorage.setItem(cardKey(playerId), JSON.stringify(card));
  return card;
};

const clearCard = playerId => localStorage.removeItem(cardKey(playerId));

const saveCard = (playerId, card) => localStorage.setItem(cardKey(playerId), JSON.stringify(card));

// ─── LEVEL / STREAK ──────────────────────────────────────────────────────────
const RANKS      = ['RECRUIT','OPERATOR','RUNNER','GHOST','HACKER','PHANTOM','SPECTER','WRAITH','SHADOW','LEGEND'];
const THRESHOLDS = [0,100,300,600,1000,1500,2500,4000,6000,9000];

const getLevel = pts => {
  for (let i=THRESHOLDS.length-1; i>=0; i--) if (pts>=THRESHOLDS[i]) return {num:i+1, rank:RANKS[i]};
  return {num:1, rank:'RECRUIT'};
};
const getStreak = (playerId, logs) => {
  let streak=0; const d=new Date(); d.setHours(0,0,0,0);
  for (let i=0; i<365; i++) {
    const has = logs.some(l => { const lt=new Date(l.timestamp); lt.setHours(0,0,0,0); return l.playerId===playerId && l.status==='approved' && lt.getTime()===d.getTime(); });
    if (!has) break; streak++; d.setDate(d.getDate()-1);
  }
  return streak;
};
const getTotalPts = (playerId, logs) => logs.filter(l=>l.playerId===playerId&&l.status==='approved').reduce((s,l)=>s+l.points,0);

// ─── CHORE ROW ───────────────────────────────────────────────────────────────
function ChoreRow({ chore, checked, onToggle }) {
  const escalLabel = ['', '!', '!!'][chore.escalLevel] || '';
  const escalColor = ['#555', '#F5A623', '#EF4444'][chore.escalLevel];
  return (
    <div onClick={onToggle} style={{
      display:'flex', alignItems:'center', gap:'12px',
      padding:'14px 0', borderBottom:'1px solid #e5e5e5',

      <span style={{
        color: checked ? ACCENT : '#bbb',
        fontFamily:'monospace', fontSize:'0.9rem', flexShrink:0, userSelect:'none',

        {checked ? '[+]' : '[ ]'}
      </span>
      <span style={{
        flex:1, fontFamily:'monospace', fontSize:'0.88rem',
        color: checked ? '#bbb' : '#111',
        textDecoration: checked ? 'line-through' : 'none',
      }}>
        {chore.name}
      </span>
      <span style={{
        fontFamily:'monospace', fontSize:'0.75rem', flexShrink:0,
        color: escalLabel ? escalColor : '#bbb',
      }}>
        {escalLabel ? `${escalLabel} ` : ''}{chore.currentMinutes}m
      </span>
    </div>
  );
}

// ─── CHORE PICKER ────────────────────────────────────────────────────────────
// A full day is ~25 min of work. The player picks what they want, then we
// auto-suggest sensible short chores to fill the rest — building the habit of
// doing a little every day so nothing piles up into a long chore.
function ChorePicker({ player, logs, syncStatus, onBack, onConfirm }) {
  const pool = pickableChores(player.id, logs);
  const [picked, setPicked]       = useState([]);  // all selected ids
  const [suggested, setSuggested] = useState([]);  // subset of picked we auto-added

  const chosen    = pool.filter(c => picked.includes(c.id));
  const total     = chosen.reduce((s,c)=>s+c.currentMinutes, 0);
  const remaining = DAILY_MINUTES - total;

  const minUnpicked = pool.filter(c=>!picked.includes(c.id)).reduce((m,c)=>Math.min(m,c.currentMinutes), Infinity);
  const canAddMore  = minUnpicked <= remaining;             // a chore still fits the budget
  const full        = total >= DAILY_MINUTES - 5;           // 20+ min counts as a full day
  const ready       = chosen.length >= 1 && (full || !canAddMore);

  const toggle = c => {
    if (picked.includes(c.id)) {
      setPicked(picked.filter(id=>id!==c.id));
      setSuggested(suggested.filter(id=>id!==c.id));
    } else if (c.currentMinutes <= remaining) {
      setPicked([...picked, c.id]);                          // a manual pick, not a suggestion
      setSuggested(suggested.filter(id=>id!==c.id));
    }
  };

  const fill = () => {
    const next  = suggestFill(picked, pool, DAILY_MINUTES);
    const added = next.filter(id=>!picked.includes(id));
    setPicked(next);
    setSuggested([...new Set([...suggested.filter(id=>next.includes(id)), ...added])]);
  };

  const syncLabel = syncStatus==='syncing' ? 'sync...' : syncStatus==='offline' ? 'offline' : 'live';
  const syncColor = syncStatus==='offline' ? '#EF4444' : syncStatus==='syncing' ? '#F5A623' : '#bbb';

  return (
    <div className="fade-in" style={{display:'flex', flexDirection:'column', height:'100%'}}>
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'12px 20px', borderBottom:'1px solid #e5e5e5', flexShrink:0,
      }}>
        <button onClick={onBack} style={{
          background:'none', border:'none', color:'#999',
          fontSize:'0.75rem', cursor:'pointer', fontFamily:'monospace', letterSpacing:'1px',
        }}>← back</button>
        <span style={{fontSize:'0.65rem', color:syncColor, fontFamily:'monospace', letterSpacing:'2px'}}>
          {syncLabel}
        </span>
      </div>

      <div className="scroll" style={{flex:1, padding:'28px 20px 0'}}>
        <div style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace', letterSpacing:'3px', marginBottom:'6px'}}>
          build today's card
        </div>
        <div style={{fontSize:'0.82rem', color:'#111', fontFamily:'monospace', marginBottom:'2px'}}>
          pick what you want — then fill to {DAILY_MINUTES} min
        </div>

        <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginTop:'18px', marginBottom:'5px'}}>
          <span style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace', letterSpacing:'2px'}}>
            {chosen.length} picked
          </span>
          <span style={{fontSize:'0.72rem', color:ACCENT, fontFamily:'monospace', fontWeight:700}}>
            {total} / {DAILY_MINUTES}m
          </span>
        </div>
        <div style={{height:'4px', background:'#eee', borderRadius:'2px', overflow:'hidden', marginBottom:'18px'}}>
          <div style={{height:'100%', width:`${Math.min(100,(total/DAILY_MINUTES)*100)}%`, background:ACCENT, transition:'width 0.2s'}}/>
        </div>

        <div style={{marginBottom:'16px'}}>
          {pool.map(c => {
            const on         = picked.includes(c.id);
            const isSug      = suggested.includes(c.id);
            const tooBig     = !on && c.currentMinutes > remaining;
            const escalLabel = ['', '!', '!!'][c.escalLevel] || '';
            const escalColor = ['#555', '#F5A623', '#EF4444'][c.escalLevel];
            return (
              <div key={c.id} onClick={()=>{ if(!tooBig) toggle(c); }} style={{
                display:'flex', alignItems:'center', gap:'12px',
                padding:'14px 0', borderBottom:'1px solid #e5e5e5',
                cursor: tooBig ? 'default' : 'pointer', opacity: tooBig ? 0.35 : 1,
              }}>
                <span style={{
                  color: on ? ACCENT : '#bbb',
                  fontFamily:'monospace', fontSize:'0.9rem', flexShrink:0, userSelect:'none',
                }}>
                  {on ? '[+]' : '[ ]'}
                </span>
                <span style={{
                  flex:1, fontFamily:'monospace', fontSize:'0.88rem',
                  color: on ? ACCENT : '#111',
                }}>
                  {c.name}
                  {isSug && (
                    <span style={{marginLeft:'8px', fontSize:'0.6rem', color:'#bbb', letterSpacing:'1px'}}>suggested</span>
                  )}
                </span>
                <span style={{
                  fontFamily:'monospace', fontSize:'0.75rem', flexShrink:0,
                  color: escalLabel ? escalColor : '#bbb',
                }}>
                  {escalLabel ? `${escalLabel} ` : ''}{c.currentMinutes}m
                </span>
              </div>
            );
          })}
        </div>

        {pool.some(c=>c.escalLevel>0) && (
          <div style={{fontSize:'0.62rem', color:'#777', fontFamily:'monospace', letterSpacing:'1px', marginBottom:'16px'}}>
            ! = neglected &nbsp; !! = long overdue
          </div>
        )}
        <div style={{height:'24px'}}/>
      </div>

      <div style={{padding:'14px 20px', borderTop:'1px solid #e5e5e5', flexShrink:0}}>
        {canAddMore && (
          <button onClick={fill} style={{
            width:'100%', padding:'13px', marginBottom:'8px', cursor:'pointer',
            background:'transparent', border:`1px solid ${ACCENT}`, color:ACCENT,
            fontSize:'0.72rem', fontWeight:700, letterSpacing:'2px', fontFamily:'monospace',
          }}>
            {chosen.length ? `✨ FILL TO ${DAILY_MINUTES}M` : `✨ SUGGEST A ${DAILY_MINUTES}-MIN CARD`}
          </button>
        )}
        <button onClick={()=>{ if(ready) onConfirm(chosen); }} disabled={!ready} style={{
          width:'100%', padding:'17px', cursor:ready?'pointer':'default',
          background: ready ? ACCENT : 'transparent',
          border:`1px solid ${ready ? ACCENT : '#e0e0e0'}`,
          color: ready ? '#fff' : '#aaa',
          fontSize:'0.75rem', fontWeight:800, letterSpacing:'3px',
          fontFamily:'monospace', transition:'all 0.15s',
        }}>
          {ready
            ? `LOCK IN ${chosen.length} CHORE${chosen.length>1?'S':''} · ${total}M`
            : chosen.length ? `ADD MORE TO REACH ${DAILY_MINUTES}M` : `PICK OR SUGGEST CHORES`}
        </button>
      </div>
    </div>
  );
}

// ─── PLAYER CARD VIEW ────────────────────────────────────────────────────────
function PlayerCardView({ player, logs, onBack, onSubmitCard, syncStatus }) {
  const totalPts = getTotalPts(player.id, logs);
  const level    = getLevel(totalPts);
  const streak   = getStreak(player.id, logs);
  const [card, setCard]         = useState(() => loadCard(player.id));
  const [submitting, setSubmit] = useState(false);

  // No card built for today yet — let the player pick their own chores.
  if (!card) {
    return (
      <ChorePicker
        player={player} logs={logs} syncStatus={syncStatus}
        onBack={onBack}
        onConfirm={chores => setCard(buildCard(player.id, chores))}
      />
    );
  }

  const totalMin   = card.chores.reduce((s,c)=>s+c.currentMinutes,0);
  const allChecked = card.checked.every(Boolean);
  const doneCount  = card.checked.filter(Boolean).length;
  const pending    = logs.filter(l=>l.playerId===player.id&&l.status==='pending').length;

  const toggle = i => {
    if (card.submitted) return;
    const next = { ...card, checked: card.checked.map((v,idx)=>idx===i?!v:v) };
    setCard(next); saveCard(player.id, next);
  };

  const submit = async () => {
    if (!allChecked || submitting || card.submitted) return;
    setSubmit(true);
    try {
      await onSubmitCard(card.chores);
      const next = { ...card, submitted:true };
      setCard(next); saveCard(player.id, next);
    } finally { setSubmit(false); }
  };

  const syncLabel = syncStatus==='syncing' ? 'sync...' : syncStatus==='offline' ? 'offline' : 'live';
  const syncColor = syncStatus==='offline' ? '#EF4444' : syncStatus==='syncing' ? '#F5A623' : '#bbb';

  return (
    <div className="fade-in" style={{display:'flex', flexDirection:'column', height:'100%'}}>
      <div style={{
        display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'12px 20px', borderBottom:'1px solid #e5e5e5', flexShrink:0,
      }}>
        <button onClick={onBack} style={{
          background:'none', border:'none', color:'#999',
          fontSize:'0.75rem', cursor:'pointer', fontFamily:'monospace', letterSpacing:'1px',
        }}>← back</button>
        <span style={{fontSize:'0.65rem', color:syncColor, fontFamily:'monospace', letterSpacing:'2px'}}>
          {syncLabel}
        </span>
      </div>

      <div className="scroll" style={{flex:1, padding:'28px 20px 0'}}>

        <div style={{marginBottom:'28px'}}>
          <div style={{
            fontSize:'0.65rem', color:'#888', fontFamily:'monospace',
            letterSpacing:'3px', marginBottom:'6px',
          }}>
            player
          </div>
          <div style={{
            fontSize:'1.4rem', fontWeight:900, color:'#111',
            fontFamily:'monospace', letterSpacing:'3px', textTransform:'uppercase',
          }}>
            {player.name}
          </div>
          <div style={{
            fontSize:'0.65rem', color:ACCENT, fontFamily:'monospace',
            letterSpacing:'4px', marginTop:'4px',
          }}>
            {level.rank} // LV.{level.num}
          </div>

          <div style={{
            display:'flex', gap:'0', marginTop:'20px',
            borderTop:'1px solid #e5e5e5', borderBottom:'1px solid #e5e5e5',
          }}>
            {[
              {label:'pts',    val:totalPts.toLocaleString()},
              {label:'streak', val:streak},
              {label:'level',  val:level.num},
            ].map(({label,val},i,arr)=>(
              <div key={label} style={{
                flex:1, padding:'12px 0', textAlign:'center',
                borderRight: i<arr.length-1 ? '1px solid #e5e5e5' : 'none',
              }}>
                <div style={{fontSize:'1rem', fontWeight:700, color:ACCENT, fontFamily:'monospace'}}>{val}</div>
                <div style={{fontSize:'0.6rem', color:'#888', fontFamily:'monospace', letterSpacing:'2px', marginTop:'2px'}}>{label}</div>
              </div>
            ))}
          </div>
        </div>

        <div style={{
          display:'flex', justifyContent:'space-between', alignItems:'baseline',
          marginBottom:'4px',
        }}>
          <span style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace', letterSpacing:'3px'}}>
            today's card
            {!card.submitted && (
              <button onClick={()=>{ clearCard(player.id); setCard(null); }} style={{
                marginLeft:'10px', background:'none', border:'none', color:ACCENT,
                fontSize:'0.62rem', cursor:'pointer', fontFamily:'monospace', letterSpacing:'1px',
              }}>↻ re-pick</button>
            )}
          </span>
          <span style={{fontSize:'0.65rem', color:'#888', fontFamily:'monospace'}}>
            {doneCount}/{card.chores.length} · {totalMin}m
          </span>
        </div>

        <div style={{marginBottom:'16px'}}>
          {card.chores.map((chore,i) => (
            <ChoreRow key={chore.id} chore={chore}
              checked={card.checked[i]}
              onToggle={()=>toggle(i)}/>
          ))}
        </div>

        {card.chores.some(c=>c.escalLevel>0) && (
          <div style={{fontSize:'0.62rem', color:'#777', fontFamily:'monospace', letterSpacing:'1px', marginBottom:'16px'}}>
            ! = neglected &nbsp; !! = long overdue
          </div>
        )}

        {pending>0 && !card.submitted && (
          <div style={{
            padding:'10px 14px', border:'1px solid #F5A623',
            fontSize:'0.72rem', color:'#F5A623', fontFamily:'monospace',
            letterSpacing:'1px', marginBottom:'16px',
          }}>
            ! {pending} chore{pending>1?'s':''} pending approval
          </div>
        )}

        <div style={{paddingBottom:'40px'}}>
          {card.submitted ? (
            <div style={{
              padding:'16px', textAlign:'center',
              border:`1px solid ${ACCENT}`,
              fontSize:'0.72rem', color:ACCENT, fontFamily:'monospace', letterSpacing:'3px',
            }}>
              SUBMITTED — AWAITING APPROVAL
            </div>
          ) : (
            <button onClick={submit} disabled={!allChecked||submitting} style={{
              width:'100%', padding:'17px', cursor:allChecked?'pointer':'default',
              background: allChecked ? ACCENT : 'transparent',
              border:`1px solid ${allChecked ? ACCENT : '#e0e0e0'}`,
              color: allChecked ? '#fff' : '#aaa',
              fontSize:'0.75rem', fontWeight:800, letterSpacing:'3px',
              fontFamily:'monospace', transition:'all 0.15s',
            }}>
              {submitting ? 'SUBMITTING...' : allChecked ? 'SUBMIT CARD' : `CHECK OFF ALL ${card.chores.length} CHORES`}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── PLAYER SELECT ───────────────────────────────────────────────────────────
function PlayerSelect({ onSelect, onAdmin }) {
  const [taps, setTaps] = useState(0);
  const tapTimer        = useRef(null);

  const handleTitle = () => {
    const n = taps+1; setTaps(n);
    clearTimeout(tapTimer.current);
    if (n>=5) { onAdmin(); setTaps(0); return; }
    tapTimer.current = setTimeout(()=>setTaps(0), 2000);
  };

  return (
    <div className="fade-in" style={{
      display:'flex', flexDirection:'column', alignItems:'center',
      justifyContent:'center', height:'100%', padding:'40px 28px',
    }}>
      <div onClick={handleTitle} style={{marginBottom:'52px', cursor:'default', userSelect:'none', textAlign:'center'}}>
        <div style={{
          fontSize:'1.3rem', fontWeight:900, letterSpacing:'6px',
          color:'#F23861', fontFamily:'monospace',
        }}>GYATTCHORES</div>
        <div style={{fontSize:'0.6rem', letterSpacing:'4px', color:'#666', fontFamily:'monospace', marginTop:'6px'}}>
          select player
        </div>
      </div>

      <div style={{width:'100%', maxWidth:'300px'}}>
        {PLAYERS.map(p => (
          <button key={p.id} onClick={()=>onSelect(p)} style={{
            display:'block', width:'100%',
            padding:'18px 20px', marginBottom:'8px',
            background:'transparent',
            border:'1px solid #e0e0e0',
            color:'#111', fontSize:'0.88rem', fontWeight:700,
            letterSpacing:'4px', fontFamily:'monospace',
            textAlign:'left', cursor:'pointer',
            transition:'border-color 0.1s, color 0.1s',
          }}
          onPointerEnter={e=>{e.currentTarget.style.borderColor=ACCENT; e.currentTarget.style.color=ACCENT;}}
          onPointerLeave={e=>{e.currentTarget.style.borderColor='#e0e0e0'; e.currentTarget.style.color='#111';}}>
            {'> '}{p.name}
          </button>
        ))}
      </div>

      <div style={{
        marginTop:'48px', display:'flex', gap:'24px',
        fontSize:'0.62rem', fontFamily:'monospace', letterSpacing:'2px',
      }}>
        {[['about','/about.html'],['guide','/ebook.html'],['story','/development-story.html']].map(([label,href])=>(
          <a key={label} href={href} style={{color:'#555', textDecoration:'none'}}
             onMouseEnter={e=>e.target.style.color='#888'}
             onMouseLeave={e=>e.target.style.color='#555'}>{label}</a>
        ))}
      </div>
    </div>
  );
}

// ─── ADMIN MODAL ─────────────────────────────────────────────────────────────
function AdminModal({ logs, onClose, onUpdate }) {
  const [code, setCode]   = useState('');
  const [authed, setAuth] = useState(false);
  const [filter, setFilt] = useState('pending');

  const verify = () => { if (code===ADMIN_CODE) setAuth(true); };
  const shown  = logs.filter(l=>filter==='all'||l.status===filter).slice(0,60);

  if (!authed) return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.97)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:'24px'}}>
      <div style={{background:'#fff',border:'1px solid #e0e0e0',padding:'32px',width:'100%',maxWidth:'300px',textAlign:'center'}}>
        <div style={{fontSize:'0.65rem',letterSpacing:'5px',color:'#888',fontFamily:'monospace',marginBottom:'24px'}}>ADMIN ACCESS</div>
        <input type="password" value={code} onChange={e=>setCode(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&verify()} placeholder="——" autoFocus
          style={{width:'100%',padding:'14px',background:'#f5f5f5',border:'1px solid #e0e0e0',color:'#111',fontSize:'1.4rem',textAlign:'center',fontFamily:'monospace',outline:'none',letterSpacing:'8px',marginBottom:'16px'}}/>
        <button onClick={verify} style={{width:'100%',padding:'13px',background:ACCENT,border:'none',color:'#fff',fontWeight:800,fontSize:'0.75rem',letterSpacing:'3px',fontFamily:'monospace',cursor:'pointer'}}>ENTER</button>
        <button onClick={onClose} style={{width:'100%',padding:'13px',background:'none',border:'none',color:'#888',fontSize:'0.72rem',cursor:'pointer',fontFamily:'monospace',marginTop:'6px'}}>cancel</button>
      </div>
    </div>
  );

  return (
    <div style={{position:'fixed',inset:0,background:'#fff',display:'flex',flexDirection:'column',zIndex:200}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 20px',borderBottom:'1px solid #e5e5e5',flexShrink:0}}>
        <div style={{fontSize:'0.65rem',letterSpacing:'4px',color:ACCENT,fontFamily:'monospace'}}>ADMIN</div>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#999',fontSize:'0.78rem',cursor:'pointer',fontFamily:'monospace'}}>✕ close</button>
      </div>

      <div style={{display:'flex',gap:'8px',padding:'12px 20px',borderBottom:'1px solid #e5e5e5',flexShrink:0,flexWrap:'wrap'}}>
        {['pending','approved','rejected','all'].map(f=>(
          <button key={f} onClick={()=>setFilt(f)} style={{
            padding:'5px 12px', cursor:'pointer',
            background: filter===f ? ACCENT : 'transparent',
            border:`1px solid ${filter===f ? ACCENT : '#e0e0e0'}`,
            color: filter===f ? '#000' : '#999',
            fontSize:'0.68rem', fontWeight:700, letterSpacing:'1px', fontFamily:'monospace',
          }}>{f}</button>
        ))}
      </div>

      <div className="scroll" style={{flex:1,padding:'16px 20px'}}>
        {shown.length===0 && (
          <div style={{textAlign:'center',color:'#666',fontFamily:'monospace',fontSize:'0.78rem',marginTop:'48px',letterSpacing:'2px'}}>
            no {filter} logs
          </div>
        )}
        {shown.map(log => (
          <div key={log.id} style={{border:'1px solid #e5e5e5',padding:'14px 16px',marginBottom:'8px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'10px'}}>
              <div>
                <div style={{fontSize:'0.87rem',fontWeight:600,color:'#111',fontFamily:'monospace'}}>{log.choreName}</div>
                <div style={{fontSize:'0.68rem',color:'#888',fontFamily:'monospace',marginTop:'3px'}}>
                  {log.playerName} · {new Date(log.timestamp).toLocaleString()}
                </div>
              </div>
              <div style={{fontSize:'0.75rem',fontWeight:700,color:ACCENT,fontFamily:'monospace',flexShrink:0,marginLeft:'12px'}}>
                {log.points}pts
              </div>
            </div>
            {log.status==='pending' ? (
              <div style={{display:'flex',gap:'8px'}}>
                <button onClick={()=>onUpdate(log.id,'approved')} style={{flex:1,padding:'9px',background:'transparent',border:'1px solid #22C55E',color:'#22C55E',fontSize:'0.7rem',fontWeight:700,cursor:'pointer',fontFamily:'monospace',letterSpacing:'1px'}}>APPROVE</button>
                <button onClick={()=>onUpdate(log.id,'rejected')} style={{flex:1,padding:'9px',background:'transparent',border:'1px solid #EF4444',color:'#EF4444',fontSize:'0.7rem',fontWeight:700,cursor:'pointer',fontFamily:'monospace',letterSpacing:'1px'}}>REJECT</button>
              </div>
            ) : (
              <div style={{fontSize:'0.68rem',color:log.status==='approved'?'#22C55E':'#EF4444',fontFamily:'monospace',letterSpacing:'1px'}}>{log.status}</div>
            )}
          </div>
        ))}
        <div style={{height:'40px'}}/>
      </div>
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [player,    setPlayer]  = useState(null);
  const [showAdmin, setAdmin]   = useState(false);
  const [logs,      setLogs]    = useState(loadLogs);
  const [syncStatus,setSyncSt]  = useState(supabase?'idle':'offline');

  const sync = useCallback(async () => {
    if (!supabase) { setSyncSt('offline'); return; }
    setSyncSt('syncing');
    let work = loadLogs();
    try {
      for (const l of work.filter(x=>x.remoteId==null)) {
        const {data,error} = await supabase.from('simple_logs').insert(toRow(l)).select().single();
        if (error) throw error;
        l.remoteId=data.id; l.synced=true; l.statusDirty=false;
        if (data.created_at) l.timestamp=data.created_at;
      }
      // Push status changes (approve/reject). Confirm with .select() and clear
      // the dirty flag only when a row was actually updated — a silently dropped
      // update (0 rows, no error) is left dirty so it retries instead of vanishing.
      for (const l of work.filter(x=>x.remoteId!=null&&x.statusDirty)) {
        const {data,error} = await supabase.from('simple_logs').update({status:l.status}).eq('id',l.remoteId).select();
        if (error) throw error;
        if (data && data.length) l.statusDirty=false;
      }
      const {data:rows,error:selErr} = await supabase.from('simple_logs').select('*').order('created_at',{ascending:false});
      if (selErr) throw selErr;
      const remoteIds=new Set((rows||[]).map(r=>String(r.id)));
      // Self-heal orphaned rows: if a dirty log points at a remote row that no
      // longer exists (e.g. the table was reset), the update can never land —
      // recreate the row so the approval actually propagates.
      for (const l of work) {
        if (l.statusDirty && l.remoteId!=null && !remoteIds.has(String(l.remoteId))) {
          const {data,error} = await supabase.from('simple_logs').insert(toRow(l)).select().single();
          if (error) throw error;
          l.remoteId=data.id; l.synced=true; l.statusDirty=false;
          if (data.created_at) l.timestamp=data.created_at;
          remoteIds.add(String(data.id));
        }
      }
      const byRemote={};
      work.forEach(l=>{if(l.remoteId!=null) byRemote[String(l.remoteId)]=l;});
      (rows||[]).forEach(r=>{
        const ex=byRemote[String(r.id)];
        if(ex){if(!ex.statusDirty) ex.status=r.status;} else work.push(rowToLocal(r));
      });
      // Re-apply changes made locally while this sync was in flight. Only when
      // the status genuinely differs, so we never re-dirty (and re-push forever)
      // a change we just confirmed.
      const latest=loadLogs(), workById={};
      work.forEach(l=>{workById[l.id]=l;});
      latest.forEach(l=>{
        if(!workById[l.id]) work.push(l);
        else if(l.statusDirty && workById[l.id].status!==l.status){workById[l.id].status=l.status; workById[l.id].statusDirty=true;}
      });
      work.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
      saveLogs(work); setLogs(work.slice()); setSyncSt('synced');
    } catch(e) {
      console.warn('sync deferred:', e?.message||e); setSyncSt('offline');
    }
  }, []);

  useEffect(()=>{sync();},[sync]);
  useEffect(()=>{
    const t=setInterval(sync,5000);
    const onVis=()=>{if(!document.hidden) sync();};
    const onOnl=()=>sync();
    const onSto=e=>{if(e.key===STORAGE_KEY) setLogs(loadLogs());};
    document.addEventListener('visibilitychange',onVis);
    window.addEventListener('online',onOnl);
    window.addEventListener('storage',onSto);
    return ()=>{clearInterval(t); document.removeEventListener('visibilitychange',onVis); window.removeEventListener('online',onOnl); window.removeEventListener('storage',onSto);};
  },[sync]);

  const submitCard = useCallback(async (chores) => {
    const now = Date.now();
    const newLogs = chores.map((c,i) => ({
      id:makeId(), remoteId:null, synced:false, statusDirty:false,
      playerId:player.id, playerName:player.name,
      choreId:c.id, choreName:c.name, choreIcon:'',
      points:c.pts, timestamp:new Date(now+i).toISOString(), status:'pending',
    }));
    const next = [...newLogs, ...loadLogs()].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    saveLogs(next); setLogs(next); sync();
  }, [player, sync]);

  const updateLog = useCallback((localId, status) => {
    const work = loadLogs().map(l=>l.id===localId?{...l,status,statusDirty:true}:l);
    saveLogs(work); setLogs(work.slice()); sync();
  }, [sync]);

  return (
    <div style={{height:'100%'}}>
      {showAdmin && <AdminModal logs={logs} onClose={()=>setAdmin(false)} onUpdate={updateLog}/>}
      {!showAdmin && !player && <PlayerSelect onSelect={setPlayer} onAdmin={()=>setAdmin(true)}/>}
      {!showAdmin && player && (
        <PlayerCardView
          player={player} logs={logs}
          onBack={()=>{setPlayer(null); sync();}}
          onSubmitCard={submitCard}
          syncStatus={syncStatus}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
