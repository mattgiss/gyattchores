name: Daily Business Review

# push reports in every morning at 09:00 et.

on:
  schedule:
    - cron: '0 14 * * *'
  push:
    branches: [main]
    paths:
      - 'docs/dbr/status.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-dbr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: push reports in
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          DATE=$(date -u +"%-d %b %Y" | tr '[:upper:]' '[:lower:]')
          STATUS=$(cat docs/dbr/status.json)

          build_field() {
            local prog="$1"
            local raw_status blockers_count highs_count top_blocker top_high
            raw_status=$(echo "$STATUS"     | jq -r ".programs[] | select(.id==\"$prog\") | .status")
            blockers_count=$(echo "$STATUS" | jq -r ".programs[] | select(.id==\"$prog\") | .blockers | length")
            highs_count=$(echo "$STATUS"    | jq -r ".programs[] | select(.id==\"$prog\") | .highs | length")
            top_blocker=$(echo "$STATUS"    | jq -r ".programs[] | select(.id==\"$prog\") | .blockers[0] // \"\"")
            top_high=$(echo "$STATUS"       | jq -r ".programs[] | select(.id==\"$prog\") | .highs[0] // \"\"")

            local out="${raw_status} · ${blockers_count} blocker(s), ${highs_count} high(s)"
            if [ -n "$top_blocker" ]; then
              out="${out}\n→ ${top_blocker}"
            elif [ -n "$top_high" ]; then
              out="${out}\n→ ${top_high}"
            fi
            printf '%s' "$out"
          }

          INFRA_FIELD=$(build_field "infrastructure")
          APPSTORE_FIELD=$(build_field "app-store")
          DISCORD_FIELD=$(build_field "discord")
          ROADMAP_FIELD=$(build_field "roadmap")

          TOTAL_RED=$(echo "$STATUS"    | jq '[.programs[] | select(.status=="red")]    | length')
          TOTAL_YELLOW=$(echo "$STATUS" | jq '[.programs[] | select(.status=="yellow")] | length')

          if [ "$TOTAL_RED" -gt 2 ]; then
            COLOR=15158332
          elif [ "$TOTAL_RED" -gt 0 ]; then
            COLOR=16756480
          else
            COLOR=5763719
          fi

          if [ "$TOTAL_RED" -gt 0 ]; then
            SITREP="${TOTAL_RED} blocker(s) active. moving when they clear."
          elif [ "$TOTAL_YELLOW" -gt 0 ]; then
            SITREP="no blockers. ${TOTAL_YELLOW} program(s) need watching."
          else
            SITREP="all clear."
          fi

          ISSUES_LINK="https://github.com/${{ github.repository }}/issues"
          TRACKER_LINK="https://github.com/${{ github.repository }}/blob/main/docs/dbr/status.json"

          PAYLOAD=$(jq -n \
            --arg date         "push // $DATE" \
            --arg sitrep       "$SITREP" \
            --arg infra        "$INFRA_FIELD" \
            --arg appstore     "$APPSTORE_FIELD" \
            --arg discord_prog "$DISCORD_FIELD" \
            --arg roadmap      "$ROADMAP_FIELD" \
            --arg links        "[issues]($ISSUES_LINK) · [tracker]($TRACKER_LINK)" \
            --argjson color    "$COLOR" \
            '{
              thread_name: $date,
              embeds: [{
                title: $date,
                description: $sitrep,
                color: $color,
                fields: [
                  {name: "prod — infrastructure",    value: $infra,        inline: false},
                  {name: "app store — ios launch",   value: $appstore,     inline: false},
                  {name: "discord — notifications",  value: $discord_prog, inline: false},
                  {name: "roadmap — 2027",           value: $roadmap,      inline: false},
                  {name: "links",                    value: $links,        inline: false}
                ],
                footer: {text: "push // gyattchores // daily 09:00 et"}
              }]
            }')

          HTTP=$(curl -s -o /tmp/discord_resp.txt -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "Discord HTTP: $HTTP"; cat /tmp/discord_resp.txt || true
          [ "$HTTP" = "204" ] || { echo "::error::dbr failed (HTTP $HTTP)"; exit 1; }
