name: Business Review

# fires when status.json changes on main (user-impacting updates only)
# or manually via workflow_dispatch. no schedule — push sends when it matters.

on:
  push:
    branches: [main]
    paths:
      - 'docs/dbr/status.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-dbr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post status to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          DATE=$(date -u +"%-d %b %Y" | tr '[:upper:]' '[:lower:]')
          STATUS=$(cat docs/dbr/status.json)

          TOTAL_RED=$(echo "$STATUS"    | jq '[.programs[] | select(.status=="red")]    | length')
          TOTAL_YELLOW=$(echo "$STATUS" | jq '[.programs[] | select(.status=="yellow")] | length')

          if [ "$TOTAL_RED" -gt 2 ]; then
            COLOR=15158332
          elif [ "$TOTAL_RED" -gt 0 ]; then
            COLOR=16756480
          else
            COLOR=5763719
          fi

          if [ "$TOTAL_RED" -gt 0 ]; then
            SITREP="${TOTAL_RED} blocker(s) active. moving when they clear."
          elif [ "$TOTAL_YELLOW" -gt 0 ]; then
            SITREP="no blockers. ${TOTAL_YELLOW} program(s) watching."
          else
            SITREP="all clear."
          fi

          # Build compact one-line-per-program status board, red first
          SORTED_IDS=$(echo "$STATUS" | jq -r '
            .programs
            | sort_by(if .status=="red" then 0 elif .status=="yellow" then 1 else 2 end)
            | .[].id')

          BOARD=""
          while IFS= read -r prog; do
            raw_status=$(echo "$STATUS" | jq -r ".programs[] | select(.id==\"$prog\") | .status")
            prog_id=$(echo "$STATUS"    | jq -r ".programs[] | select(.id==\"$prog\") | .id")
            blocker=$(echo "$STATUS"    | jq -r ".programs[] | select(.id==\"$prog\") | .blockers[0] // \"\"")
            high=$(echo "$STATUS"       | jq -r ".programs[] | select(.id==\"$prog\") | .highs[0] // \"\"")

            case "$raw_status" in
              red)    TAG="red   " ;;
              yellow) TAG="watch " ;;
              green)  TAG="ok    " ;;
              *)      TAG="?     " ;;
            esac

            if [ -n "$blocker" ]; then
              DETAIL=" — ${blocker}"
            elif [ -n "$high" ]; then
              DETAIL=" — ${high}"
            else
              DETAIL=""
            fi

            BOARD="${BOARD}\`${TAG}\` **${prog_id}**${DETAIL}\n"
          done <<< "$SORTED_IDS"

          ISSUES_LINK="https://github.com/${{ github.repository }}/issues"
          TRACKER_LINK="https://github.com/${{ github.repository }}/blob/main/docs/dbr/status.json"

          DESCRIPTION="${SITREP}\n\n${BOARD}\n[issues](${ISSUES_LINK}) · [tracker](${TRACKER_LINK})"

          PAYLOAD=$(jq -n \
            --arg date  "push // $DATE" \
            --arg desc  "$DESCRIPTION" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $date,
                description: $desc,
                color: $color,
                footer: {text: "push // gyattchores"}
              }]
            }')

          HTTP=$(curl -s -o /tmp/discord_resp.txt -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "Discord HTTP: $HTTP"; cat /tmp/discord_resp.txt || true
          [ "$HTTP" = "204" ] || { echo "::error::dbr failed (HTTP $HTTP)"; exit 1; }
