name: Daily Business Review

# Sent by Push — the operator behind GyattChores in the cyber universe.
# Push is technically Matt, but in here Push is the one who keeps the
# lights on, watches the programs, and reports every morning at 09:00 ET.

on:
  schedule:
    - cron: '0 14 * * *'   # 09:00 ET / 14:00 UTC every day
  push:
    branches: [main]
    paths:
      - 'docs/dbr/status.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-dbr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push reports in
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          DATE=$(date -u +"%d.%b.%Y" | tr '[:lower:]' '[:upper:]')
          STATUS=$(cat docs/dbr/status.json)

          build_field() {
            local prog="$1"
            local raw_status blockers_count highs_count top_blocker top_high
            raw_status=$(echo "$STATUS"     | jq -r ".programs[] | select(.id==\"$prog\") | .status")
            blockers_count=$(echo "$STATUS" | jq -r ".programs[] | select(.id==\"$prog\") | .blockers | length")
            highs_count=$(echo "$STATUS"    | jq -r ".programs[] | select(.id==\"$prog\") | .highs | length")
            top_blocker=$(echo "$STATUS"    | jq -r ".programs[] | select(.id==\"$prog\") | .blockers[0] // \"\"")
            top_high=$(echo "$STATUS"       | jq -r ".programs[] | select(.id==\"$prog\") | .highs[0] // \"\"")

            case "$raw_status" in
              red)    RAG="🔴 RED"    ;;
              yellow) RAG="🟡 YELLOW" ;;
              green)  RAG="🟢 GREEN"  ;;
              *)      RAG="⚪ UNKNOWN" ;;
            esac

            local out="${RAG}  ·  blockers: ${blockers_count}  highs: ${highs_count}"
            if [ -n "$top_blocker" ]; then
              out="${out}\n\`→ ${top_blocker}\`"
            elif [ -n "$top_high" ]; then
              out="${out}\n\`→ ${top_high}\`"
            fi
            printf '%s' "$out"
          }

          INFRA_FIELD=$(build_field "infrastructure")
          APPSTORE_FIELD=$(build_field "app-store")
          DISCORD_FIELD=$(build_field "discord")
          ROADMAP_FIELD=$(build_field "roadmap")

          TOTAL_RED=$(echo "$STATUS"    | jq '[.programs[] | select(.status=="red")]    | length')
          TOTAL_YELLOW=$(echo "$STATUS" | jq '[.programs[] | select(.status=="yellow")] | length')
          TOTAL_GREEN=$(echo "$STATUS"  | jq '[.programs[] | select(.status=="green")]  | length')

          # Push sets the color by overall health
          if [ "$TOTAL_RED" -gt 2 ]; then
            COLOR=15158332   # red — multiple programs blocked
          elif [ "$TOTAL_RED" -gt 0 ]; then
            COLOR=16756480   # amber — at least one blocker
          else
            COLOR=5763719    # green — clean
          fi

          # Push writes a one-line situation read
          if [ "$TOTAL_RED" -gt 0 ]; then
            SITREP="${TOTAL_RED} program(s) blocked. Needs resolution before we move."
          elif [ "$TOTAL_YELLOW" -gt 0 ]; then
            SITREP="No hard blockers. ${TOTAL_YELLOW} program(s) at risk — watching them."
          else
            SITREP="All programs green. Systems nominal."
          fi

          ISSUES_LINK="https://github.com/${{ github.repository }}/issues"
          TRACKER_LINK="https://github.com/${{ github.repository }}/blob/main/docs/dbr/status.json"

          PAYLOAD=$(jq -n \
            --arg date         "$DATE" \
            --arg sitrep       "$SITREP" \
            --arg infra        "$INFRA_FIELD" \
            --arg appstore     "$APPSTORE_FIELD" \
            --arg discord_prog "$DISCORD_FIELD" \
            --arg roadmap      "$ROADMAP_FIELD" \
            --arg issues       "$ISSUES_LINK" \
            --arg tracker      "$TRACKER_LINK" \
            --argjson color    "$COLOR" \
            '{
              thread_name: ("PUSH :: DBR // " + $date),
              embeds: [{
                title: ("PUSH :: DBR // " + $date),
                description: ("*" + $sitrep + "*\n\n🔴 blocked  🟡 at risk  🟢 healthy"),
                color: $color,
                fields: [
                  {name: "🏗️  PROD — Infrastructure",    value: $infra,        inline: false},
                  {name: "📱  APP STORE — iOS Launch",    value: $appstore,     inline: false},
                  {name: "💬  DISCORD — Notifications",   value: $discord_prog, inline: false},
                  {name: "🏆  ROADMAP — App of Year 2027",value: $roadmap,      inline: false},
                  {name: "—",
                   value: ("[open issues](" + $issues + ")  ·  [program tracker](" + $tracker + ")"),
                   inline: false}
                ],
                footer: {text: "push // gyattchores ops // daily 09:00 et"}
              }]
            }')

          HTTP=$(curl -s -o /tmp/discord_resp.txt -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "Discord HTTP: $HTTP"; cat /tmp/discord_resp.txt || true
          [ "$HTTP" = "204" ] || { echo "::error::DBR failed (HTTP $HTTP)"; exit 1; }
