name: CI

# Validates pull requests before they can merge into main. The site is plain HTML
# with no build step, so the gate is: scripts parse, internal links resolve, and
# the front page stays a plain page. Wire this in as a required status check on
# the main branch rule.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate site (scripts, links, front page)
        run: node scripts/validate-build.mjs
