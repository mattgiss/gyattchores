name: iOS

# Checks the native iOS app (ios/):
#   fixtures — the golden test vectors still match the web app's engine
#   core     — the Swift port of the game rules passes against those vectors
#   app      — the SwiftUI app builds and its UI tests pass in an iOS simulator
# index.html is in the path list because it's the source of truth for the game
# rules: change a rule there and this says whether the Swift port still agrees.

on:
  push:
    paths:
      - 'ios/**'
      - 'tools/native/**'
      - 'index.html'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Engine fixtures match index.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate fixtures from the web engine
        run: node tools/native/generate-engine-fixtures.mjs
      - name: Fail if the committed fixtures are stale
        run: |
          if ! git diff --quiet -- ios/GyattCore/Tests; then
            echo "::error::The web engine in index.html changed. Run 'node tools/native/generate-engine-fixtures.mjs', commit the result, and update ios/GyattCore to match if tests fail."
            git diff --stat -- ios/GyattCore/Tests
            exit 1
          fi

  core:
    name: GyattCore tests
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/GyattCore
        run: swift test

  app:
    name: Build and UI-test app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick simulators
        id: sims
        run: |
          xcodebuild -version
          AVAILABLE=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | .name | select(startswith("iPhone"))] | unique | .[]')
          echo "Available iPhone simulators:"; echo "$AVAILABLE" | sed 's/^/  /'
          # The phones this app is aimed at, where this Xcode has them.
          PICKED=""
          for want in "iPhone 17 Pro" "iPhone 16e"; do
            if echo "$AVAILABLE" | grep -qx "$want"; then PICKED="$PICKED$want"$'\n'; fi
          done
          if [ -z "$PICKED" ]; then
            for want in "iPhone 16 Pro" "iPhone 16" "iPhone 15"; do
              if echo "$AVAILABLE" | grep -qx "$want"; then PICKED="$want"$'\n'; break; fi
            done
          fi
          [ -n "$PICKED" ] || { echo "::error::No iPhone simulator available"; exit 1; }
          printf '%s' "$PICKED" > "$RUNNER_TEMP/simulators.txt"
          echo "Testing on:"; sed 's/^/  /' "$RUNNER_TEMP/simulators.txt"
      - name: Build and run UI tests
        working-directory: ios
        run: |
          set -o pipefail
          status=0
          while IFS= read -r device; do
            [ -n "$device" ] || continue
            slug=$(echo "$device" | tr ' ' '-')
            echo "::group::UI tests on $device"
            xcodebuild test \
              -project GyattChores.xcodeproj \
              -scheme GyattChores \
              -destination "platform=iOS Simulator,name=$device,OS=latest" \
              -resultBundlePath "results/$slug.xcresult" \
              2>&1 | tee "build-$slug.log" \
              | grep -E "error:|Test Case|Test Suite|XCTAssert|failed|\*\* " || true
            echo "::endgroup::"
            if ! grep -q "TEST SUCCEEDED" "build-$slug.log"; then
              echo "::error::UI tests failed on $device"
              status=1
            fi
            xcrun xcresulttool export attachments --path "results/$slug.xcresult" --output-path "screenshots/$slug" || true
          done < "$RUNNER_TEMP/simulators.txt"
          exit $status
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/screenshots
          if-no-files-found: warn
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ios/build-*.log
