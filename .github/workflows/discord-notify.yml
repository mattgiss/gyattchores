name: Discord Notifications

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed, reopened]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify PR event
        if: github.event_name == 'pull_request'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [ "$ACTION" = "closed" ] && [ "$MERGED" = "true" ]; then
            TITLE="🎉 PR Merged"
            COLOR=5763719
          elif [ "$ACTION" = "closed" ]; then
            TITLE="❌ PR Closed"
            COLOR=15158332
          elif [ "$ACTION" = "reopened" ]; then
            TITLE="🔄 PR Reopened"
            COLOR=16776960
          else
            TITLE="📬 PR Opened"
            COLOR=3447003
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "**[#${PR_NUM}: ${PR_TITLE}](${PR_URL})**" \
            --arg author "$AUTHOR" \
            --argjson color "$COLOR" \
            '{embeds: [{title: $title, description: $desc, color: $color, fields: [{name: "Author", value: $author, inline: true}], footer: {text: "gyattchores"}}]}')

          curl -sf -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify push to main
        if: github.event_name == 'push'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          REPO="${{ github.repository }}"
          COMMIT_URL="https://github.com/$REPO/commit/${{ github.sha }}"
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)

          PAYLOAD=$(jq -n \
            --arg title "🚀 GyattChores Deployed" \
            --arg desc "**${FIRST_LINE}**" \
            --arg sha "[${SHORT_SHA}](${COMMIT_URL})" \
            --arg author "$AUTHOR" \
            '{embeds: [{title: $title, description: $desc, color: 5763719, fields: [{name: "Commit", value: $sha, inline: true}, {name: "Author", value: $author, inline: true}], footer: {text: "gyattchores.com"}}]}')

          curl -sf -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
