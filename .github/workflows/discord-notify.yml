name: Discord Deploy Notification

on:
  push:
    branches:
      - main

jobs:
  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    steps:
      - name: Send deploy notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          AUTHOR="${{ github.event.head_commit.author.name }}"
          REPO="${{ github.repository }}"
          RUN_URL="https://github.com/$REPO/commit/$COMMIT_SHA"

          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"🚀 GyattChores Deployed\",
                \"description\": \"**${COMMIT_MSG}**\",
                \"color\": 5763719,
                \"fields\": [
                  { \"name\": \"Commit\", \"value\": \"[\`${SHORT_SHA}\`](${RUN_URL})\", \"inline\": true },
                  { \"name\": \"Author\", \"value\": \"${AUTHOR}\", \"inline\": true }
                ],
                \"footer\": { \"text\": \"gyattchores.com\" }
              }]
            }"
