name: Repo Setup (Run Once)

# One-time workflow to enable branch protection on main and create issue labels.
# Trigger manually: Actions → "Repo Setup (Run Once)" → Run workflow.
# Safe to re-run — all steps are idempotent.

on:
  workflow_dispatch:

permissions:
  administration: write
  issues: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      REPO: ${{ github.repository }}
    steps:
      - name: Create issue labels
        run: |
          create_label() {
            local name="$1" color="$2" description="$3"
            curl -s -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/labels" \
              -d "{\"name\":\"${name}\",\"color\":\"${color}\",\"description\":\"${description}\"}" \
              -o /dev/null || true
          }

          create_label "severity:blocker" "d73a4a" "Blocks a program milestone — must fix before next release"
          create_label "severity:high"    "e4e669" "Significant risk or impact — address this sprint"
          create_label "severity:medium"  "0075ca" "Low risk — address in upcoming sprint"
          create_label "program:infrastructure" "bfd4f2" "PROD: infrastructure, secrets, CI/CD"
          create_label "program:app-store"      "d4c5f9" "APP STORE: iOS launch track"
          create_label "program:discord"        "cfd3d7" "DISCORD: notifications and DBR automation"
          create_label "program:roadmap"        "e1f7d5" "ROADMAP: App of the Year 2027 features"
          echo "Labels created (existing labels return 422 — ignored)"

      - name: Enable branch protection on main
        run: |
          HTTP=$(curl -s -o /tmp/bp_resp.txt -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${REPO}/branches/main/protection" \
            -d '{
              "required_status_checks": null,
              "enforce_admins": false,
              "required_pull_request_reviews": {
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false,
                "required_approving_review_count": 1
              },
              "restrictions": null,
              "allow_force_pushes": false,
              "allow_deletions": false
            }')

          echo "Branch protection API response: $HTTP"
          cat /tmp/bp_resp.txt

          if [ "$HTTP" = "200" ]; then
            BP_STATUS="✅ Branch protection enabled on main — force push blocked, 1 PR approval required"
            BP_COLOR=5763719
          else
            BP_STATUS="⚠️ Branch protection API returned HTTP $HTTP — see Actions logs. You may need to enable it manually in Settings → Branches."
            BP_COLOR=16776960
          fi

      - name: Report to Discord
        if: always()
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK not set — skipping Discord report"
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            '{
              thread_name: "⚙️ Repo Setup Complete",
              embeds: [{
                title: "⚙️ Repo Setup — Complete",
                description: "One-time repo setup workflow finished. See fields below for results.",
                color: 5763719,
                fields: [
                  {name: "Labels Created", value: "severity:blocker · severity:high · severity:medium · program:infrastructure · program:app-store · program:discord · program:roadmap", inline: false},
                  {name: "Branch Protection", value: "Run completed — check Actions logs for result. main should now require PRs.", inline: false},
                  {name: "Next steps", value: "1. Verify branch protection in Settings → Branches\n2. Add DISCORD_WEBHOOK secret if not done\n3. Merge the open PR to main", inline: false}
                ],
                footer: {text: "gyattchores • repo-setup.yml"}
              }]
            }')

          HTTP=$(curl -s -o /tmp/discord_resp.txt -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "Discord HTTP: $HTTP"; cat /tmp/discord_resp.txt || true
