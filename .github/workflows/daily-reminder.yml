name: Daily Card Reminder

# Fires every morning at 15:00 UTC (8 AM MST / 9 AM MDT).
# Also available via workflow_dispatch to test anytime.

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Post card reminder to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # The kids' numeric Discord user IDs (defaulted; repo Actions
          # variables override) — these make the reminder truly @mention them.
          ID_BEKINDHEARTED: ${{ vars.DISCORD_ID_BEKINDHEARTED || '1340117651732824174' }}
          ID_MEGADINOLAVA: ${{ vars.DISCORD_ID_MEGADINOLAVA || '1519426019436531786' }}
        run: |
          DATE=$(date -u +"%-d %b" | tr '[:upper:]' '[:lower:]')
          DOW=$(date -u +"%A" | tr '[:upper:]' '[:lower:]')

          if [ -n "$ID_BEKINDHEARTED" ]; then WHO_B="<@${ID_BEKINDHEARTED}>"; else WHO_B="@bekindhearted12_29866"; fi
          if [ -n "$ID_MEGADINOLAVA" ];  then WHO_M="<@${ID_MEGADINOLAVA}>";  else WHO_M="@dreadeddragon_"; fi

          # $'…' so the \n are real newlines — a plain string shows "\n" literally.
          DESC=$'bekindhearted · megadinolava\n\npick your chores, fill to 25 minutes, check them off, submit. big day? the bonus round opens after your card is in — no cap.\n\ngyattchores.com'
          PAYLOAD=$(jq -n \
            --arg content "${WHO_B} ${WHO_M} — today's cards are open!" \
            --arg title "cards are ready — ${DOW}, ${DATE}" \
            --arg desc  "$DESC" \
            '{
              content: $content,
              allowed_mentions: { parse: ["users"] },
              embeds: [{
                title: $title,
                description: $desc,
                color: 65,
                footer: { text: "gyattchores" }
              }]
            }')

          HTTP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "Discord HTTP: $HTTP"; cat /tmp/resp.txt || true
          [ "$HTTP" = "204" ] || { echo "::error::reminder failed (HTTP $HTTP)"; exit 1; }
