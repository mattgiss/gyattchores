name: Card Notify

# Polls the shared Supabase chore log every 10 minutes and posts Discord
# updates via scripts/card-notify.sh: submissions (new logs), awards
# (pending → approved, with a CLEARED banner when nothing is left waiting),
# and chores sent back. The table has no updated_at column, so approvals are
# detected by diffing each run's id→status snapshot against the previous
# one, kept in the Actions cache; the first run baselines silently.
#
# Mentions: set repository Actions variables DISCORD_ID_BEKINDHEARTED and
# DISCORD_ID_MEGADINOLAVA (Settings → Secrets and variables → Actions →
# Variables) to the kids' numeric Discord user IDs and the messages will
# truly @mention them; until then their usernames appear as plain text.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: card-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      # Public anon key — the same one shipped to every browser in index.html.
      SUPABASE_URL: https://ukshxdoqgwoxobjdclpx.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrc2h4ZG9xZ3dveG9iamRjbHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ3MjI2NDEsImV4cCI6MjA4MDI5ODY0MX0.UGNrsfG6goEA0PPWG4x7gxBueA7D5Oe9uWI-iCXIar0
      ID_BEKINDHEARTED: ${{ vars.DISCORD_ID_BEKINDHEARTED }}
      ID_MEGADINOLAVA: ${{ vars.DISCORD_ID_MEGADINOLAVA }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore snapshot
        uses: actions/cache/restore@v4
        with:
          path: state
          key: card-notify-${{ github.run_id }}
          restore-keys: card-notify-

      - name: Diff logs and notify
        run: bash scripts/card-notify.sh

      - name: Save snapshot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: card-notify-${{ github.run_id }}
