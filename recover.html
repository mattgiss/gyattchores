<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Points Recovery — GyattChores</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #fff; color: #111; font-family: 'Courier New', Courier, monospace; line-height: 1.6; }
a { color: #F23861; text-decoration: none; }
a:hover { text-decoration: underline; }
nav { border-bottom: 1px solid #e5e5e5; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: #fff; z-index: 10; }
.nav-brand { font-size: 0.85rem; font-weight: 700; letter-spacing: 4px; color: #fff; text-decoration: none; }
.nav-links { display: flex; gap: 24px; font-size: 0.72rem; letter-spacing: 1px; }
.nav-links a { color: #888; }
.nav-links a:hover { color: #F23861; }
.container { max-width: 680px; margin: 0 auto; padding: 52px 24px 80px; }
h1 { font-size: 1.1rem; font-weight: 900; letter-spacing: 2px; margin-bottom: 6px; }
.sub { font-size: 0.72rem; color: #444; letter-spacing: 1px; margin-bottom: 36px; }
.card { border: 1px solid #e5e5e5; padding: 20px; margin-bottom: 12px; }
.player-name { font-size: 0.72rem; letter-spacing: 4px; color: #F23861; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; }
.big { font-size: 2rem; font-weight: 900; color: #fff; }
.big span { font-size: 0.8rem; color: #444; font-weight: 400; }
.status-line { font-size: 0.78rem; color: #444; margin-top: 6px; }
table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.82rem; }
th { text-align: left; color: #888; padding: 6px 0; border-bottom: 1px solid #e5e5e5; font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; }
td { padding: 6px 0; border-bottom: 1px solid #f0f0f0; color: #444; }
.approved { color: #22C55E; }
.pending  { color: #F5A623; }
.rejected { color: #EF4444; }
.empty { color: #888; text-align: center; padding: 40px; font-size: 0.82rem; }
.export-btn { background: #F23861; color: #fff; border: none; padding: 12px 20px; font-size: 0.78rem; font-weight: 700; letter-spacing: 2px; cursor: pointer; margin-top: 24px; width: 100%; font-family: 'Courier New', monospace; }
.export-btn:hover { background: #d42050; }
pre { background: #f5f5f5; border: 1px solid #e5e5e5; padding: 16px; font-size: 0.72rem; overflow-x: auto; color: #888; margin-top: 16px; white-space: pre-wrap; word-break: break-all; }
.monthly-grid { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px 20px; font-size: 0.82rem; margin-top: 14px; padding-top: 14px; border-top: 1px solid #e5e5e5; }
.month-label { color: #444; }
.month-pts   { color: #111; font-weight: 700; }
.month-count { color: #888; }
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-brand">GYATTCHORES</a>
  <div class="nav-links">
    <a href="/">app</a>
    <a href="/about.html">about</a>
  </div>
</nav>
<div class="container">
  <h1>POINTS RECOVERY</h1>
  <p class="sub">reads this device's local storage — open on the same browser where you use gyattchores</p>

  <div id="output"></div>
  <button class="export-btn" onclick="copyJSON()">COPY RAW JSON TO CLIPBOARD</button>
  <pre id="raw"></pre>
</div>

<script>
const KEY = 'gyattchores_logs';

function run() {
  const raw   = localStorage.getItem(KEY);
  const out   = document.getElementById('output');
  const rawEl = document.getElementById('raw');

  if (!raw) {
    out.innerHTML = '<div class="card"><p class="empty">no data found on this device.<br>points may be in supabase — run the points-recovery github action.</p></div>';
    return;
  }

  let logs;
  try { logs = JSON.parse(raw); } catch(e) {
    out.innerHTML = '<div class="card"><p class="empty">found data but could not parse it.</p></div>';
    rawEl.textContent = raw;
    return;
  }

  rawEl.textContent = JSON.stringify(logs, null, 2);

  const approved = logs.filter(l => l.status === 'approved');
  const players  = [...new Set(logs.map(l => l.playerName || l.player_name))].filter(Boolean);

  let html = '';

  players.forEach(p => {
    const pLogs    = approved.filter(l => (l.playerName || l.player_name) === p);
    const allLogs  = logs.filter(l => (l.playerName || l.player_name) === p);
    const totalPts = pLogs.reduce((s, l) => s + (l.points || 0), 0);
    const pending  = allLogs.filter(l => l.status === 'pending').length;
    const rejected = allLogs.filter(l => l.status === 'rejected').length;

    const byMonth = {};
    pLogs.forEach(l => {
      const m = (l.timestamp || l.created_at || '').slice(0, 7);
      if (!m) return;
      if (!byMonth[m]) byMonth[m] = { pts: 0, count: 0 };
      byMonth[m].pts   += l.points || 0;
      byMonth[m].count += 1;
    });

    const monthRows = Object.keys(byMonth).sort().map(m => {
      const label = new Date(m + '-02').toLocaleString('default', { month: 'long', year: 'numeric' });
      return `<div class="month-label">${label}</div>
              <div class="month-pts">${byMonth[m].pts.toLocaleString()} pts</div>
              <div class="month-count">${byMonth[m].count} chores</div>`;
    }).join('');

    const choreCount = {};
    pLogs.forEach(l => {
      const n = l.choreName || l.chore_name || 'unknown';
      choreCount[n] = (choreCount[n] || 0) + 1;
    });
    const topChores = Object.entries(choreCount)
      .sort((a,b) => b[1]-a[1]).slice(0,5)
      .map(([n,c]) => `<tr><td>${n}</td><td>${c}x</td></tr>`).join('');

    html += `
    <div class="card">
      <div class="player-name">${p}</div>
      <div class="big">${totalPts.toLocaleString()} <span>all-time pts &nbsp;·&nbsp; ${pLogs.length} approved</span></div>
      <div class="status-line">${pending} pending &nbsp;·&nbsp; ${rejected} rejected</div>
      ${monthRows ? `<div class="monthly-grid">${monthRows}</div>` : ''}
      ${topChores ? `<table style="margin-top:16px"><tr><th>chore</th><th>count</th></tr>${topChores}</table>` : ''}
    </div>`;
  });

  const grand = approved.reduce((s,l) => s + (l.points||0), 0);
  html += `
  <div class="card">
    <div class="player-name">all players</div>
    <div class="big">${grand.toLocaleString()} <span>total pts &nbsp;·&nbsp; ${approved.length} approved &nbsp;·&nbsp; ${logs.length} total logs</span></div>
  </div>`;

  out.innerHTML = html || '<div class="card"><p class="empty">no approved logs found.</p></div>';
}

function copyJSON() {
  const raw = localStorage.getItem(KEY) || '[]';
  navigator.clipboard.writeText(raw).then(() => alert('copied'));
}

run();
</script>
</body>
</html>
