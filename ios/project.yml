# Generates GyattChores.xcodeproj. Run `xcodegen` in this folder after adding or removing files.
name: GyattChores
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  GyattCore:
    path: GyattCore
targets:
  GyattChores:
    type: application
    platform: iOS
    sources:
      - path: GyattChores
      - path: ../native/chores.json
        buildPhase: resources
    dependencies:
      - package: GyattCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gyattchores.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GyattChores
        INFOPLIST_KEY_NSFaceIDUsageDescription: Open the admin area to approve chores.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Portrait on a phone; any way up on an iPad (which also lets it share the screen with other apps).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GyattChoresUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GyattChoresUITests
    dependencies:
      - target: GyattChores
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gyattchores.app.uitests
        TEST_TARGET_NAME: GyattChores
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone and iPad
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

# A shared scheme, so `xcodebuild` (CI) and Xcode use the same build and test setup.
schemes:
  GyattChores:
    build:
      targets:
        GyattChores: all
        GyattChoresUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GyattChoresUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
