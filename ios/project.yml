# XcodeGen spec — the Xcode project is generated from this file, not committed.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open GyattChores.xcodeproj
#
# Re-run `xcodegen generate` after adding, removing or renaming files.
name: GyattChores

options:
  bundleIdPrefix: com.gissentanna
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  GyattCore:
    path: GyattCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    # Bump for every TestFlight upload — App Store Connect rejects a repeat.
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer Team ID (developer.apple.com → Membership details).
    # Leave empty and pick the team in Xcode's Signing & Capabilities tab, or
    # fill it in here so `xcodegen generate` doesn't reset it.
    DEVELOPMENT_TEAM: ""

targets:
  GyattChores:
    type: application
    platform: iOS
    sources:
      - path: GyattChores
    dependencies:
      - package: GyattCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gissentanna.gyattchores
        PRODUCT_NAME: GyattChores
        TARGETED_DEVICE_FAMILY: "1"   # iPhone
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # No Info.plist file: Xcode generates it from these keys.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: GyattChores
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The app uses no encryption beyond what iOS provides, so TestFlight
        # doesn't need to ask the export-compliance question on every build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

  GyattChoresUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GyattChoresUITests
    dependencies:
      - target: GyattChores
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gissentanna.gyattchores.uitests
        TEST_TARGET_NAME: GyattChores
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  GyattChores:
    build:
      targets:
        GyattChores: all
        GyattChoresUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GyattChoresUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
